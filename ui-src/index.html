  <title>AnyBridge</title>
  <link rel="stylesheet" href="./assets/app.css">
  <script>
    (function () {
      try {
        var schemeOf = { light: 'light', dark: 'dark', claude: 'light', eva: 'dark' };
        var saved = localStorage.getItem('byok-theme');
        var id = schemeOf[saved] ? saved : 'light';
        var root = document.documentElement;
        root.setAttribute('data-theme', id);
        root.setAttribute('data-scheme', schemeOf[id]);
        root.style.colorScheme = schemeOf[id];
      } catch (e) {}
    })();
  </script>
</head>
