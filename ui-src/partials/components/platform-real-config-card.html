              <!-- 实际配置文件查看器（大模态弹窗） -->
              <div class="glass-card" style="padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px;{{cardStyleExtra}}">
                <div style="display: flex; align-items: center; gap: 10px;">
                  <span style="display: inline-block; width: 3px; height: 16px; background: var(--accent); border-radius: 2px;"></span>
                  <div>
                    <div style="font-weight: 700; color: var(--text-primary); font-size: 13.5px;">{{titleText}}</div>
                    <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">{{descText}}</div>
                  </div>
                </div>
                <button type="button" class="btn-ghost accent" data-action="openPlatformRealConfigModal" data-arg="{{platformId}}" style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px; height: 32px; font-size: 12.5px; font-weight: 600;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"/>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                  </svg>
                  <span>查看配置文件</span>
                </button>
              </div>
