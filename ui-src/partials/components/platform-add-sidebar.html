            <!-- 左列：供应商列表 -->
            <aside class="cb-add-sidebar glass-card"{{asideIdAttr}}>
              <div class="cb-add-search">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8" />
                  <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" id="{{searchId}}" placeholder="搜索供应商" data-action="{{onSearchAction}}" data-events="input">
                <div class="provider-sort-control platform-add-sort-control" id="{{prefix}}AddSortControl">
                  <button type="button" class="provider-sort-trigger platform-add-sort-trigger" id="{{prefix}}AddSortTrigger"
                    aria-haspopup="listbox" aria-expanded="false"
                    aria-controls="{{prefix}}AddSortMenu" aria-label="供应商排序" title="供应商排序" data-action="toggle{{Pascal}}AddSort" data-pass-event>
                    <svg class="provider-sort-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                      aria-hidden="true">
                      <path d="M8 3v18"></path>
                      <path d="m4 7 4-4 4 4"></path>
                      <path d="M16 21V3"></path>
                      <path d="m20 17-4 4-4-4"></path>
                    </svg>
                    <span id="{{prefix}}AddSortLabel">默认排序</span>
                    <svg class="provider-sort-caret" width="13" height="13" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                      aria-hidden="true">
                      <path d="m6 9 6 6 6-6"></path>
                    </svg>
                  </button>
                  <div class="provider-sort-menu platform-add-sort-menu" id="{{prefix}}AddSortMenu" role="listbox"
                    aria-label="供应商排序">
                    <button type="button" class="provider-sort-option platform-add-sort-option" role="option"
                      data-sort-mode="default" data-action="choose{{Pascal}}AddSortMode" data-arg="default">默认排序</button>
                    <button type="button" class="provider-sort-option platform-add-sort-option" role="option"
                      data-sort-mode="name-asc" data-action="choose{{Pascal}}AddSortMode" data-arg="name-asc">名称正序</button>
                    <button type="button" class="provider-sort-option platform-add-sort-option" role="option"
                      data-sort-mode="name-desc" data-action="choose{{Pascal}}AddSortMode" data-arg="name-desc">名称反序</button>
                  </div>
                </div>
              </div>
              <div class="cb-add-provider-list" id="{{listId}}"></div>
            </aside>
