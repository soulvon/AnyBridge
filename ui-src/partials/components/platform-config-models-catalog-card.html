              <!-- 卡片 2：模型管理 -->
              <div class="glass-card cb-add-models-card">
                <div class="cb-add-models-head" style="padding: 14px 20px;">
                  <div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                      <span style="display: inline-block; width: 3px; height: 14px; background: var(--accent); border-radius: 2px;"></span>
                      <span class="cb-add-models-title">{{cardTitle}}</span>
                    </div>
                    <div class="cb-add-models-sub" id="{{idPrefix}}-config-model-status">{{statusText}}</div>
                  </div>
                  <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                    <button type="button" class="btn-ghost" style="padding: 2px 8px; height: 28px; font-size: 12px;" data-action="batchSet{{Pascal}}ModelCatalog" data-args="[true]" title="全选模型加入目录">全选</button>
                    <button type="button" class="btn-ghost" style="padding: 2px 8px; height: 28px; font-size: 12px;" data-action="batchSet{{Pascal}}ModelCatalog" data-args="[false]" title="清空目录选择">清空</button>
                    <button type="button" class="btn-ghost" style="padding: 2px 8px; height: 28px; font-size: 12px;" data-action="batchSet{{Pascal}}DefaultModel" data-arg="clear" title="清除当前默认模型标记">清空默认</button>
                    <span style="display: inline-block; width: 1px; height: 14px; background: var(--border); margin: 0 4px;"></span>
                    <button type="button" class="btn-ghost accent" id="{{idPrefix}}-config-fetch-models-btn" data-action="fetch{{Pascal}}ConfigModels" style="padding: 2px 10px; height: 28px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px;">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                      </svg>
                      <span>{{fetchBtnText}}</span>
                    </button>
                    <button type="button" class="btn-ghost secondary" data-action="add{{Pascal}}ModelEntry" style="padding: 2px 10px; height: 28px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px;">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                      </svg>
                      <span>{{addBtnText}}</span>
                    </button>
                  </div>
                </div>
                <div class="codex-config-model-list" id="{{idPrefix}}-config-model-list" style="max-height: 400px; min-height: 120px; overflow-y: auto; padding: 12px 20px;">
                  <div class="codex-config-model-empty">{{emptyText}}</div>
                </div>
                {{footerHtml}}
              </div>
