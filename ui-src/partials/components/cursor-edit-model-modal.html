        <!-- ═══════ CURSOR 编辑模型模态弹窗 ═══════ -->
        <div class="modal-overlay" id="cursorEditModelModal" role="dialog" aria-modal="true" aria-labelledby="cursorEditModalTitle" data-action="closeCursorEditModal" data-only-self>
          <div class="modal-container" style="max-width: 540px; width: 92%; border-radius: 16px; overflow: hidden; padding: 0; box-shadow: var(--shadow-xl, 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04));">
            <!-- 头部 -->
            <div class="modal-header" style="padding: 16px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between;">
              <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 32px; height: 32px; border-radius: 9px; background: rgba(37, 99, 235, 0.1); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                  </svg>
                </div>
                <div>
                  <div class="modal-title" id="cursorEditModalTitle" style="font-size: 15px; font-weight: 750; color: var(--text-primary); line-height: 1.2;">编辑 Cursor 模型</div>
                  <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">修改模型在 Cursor 列表中呈现的名称与调用参数</div>
                </div>
              </div>
              <button class="btn-ghost icon-btn" data-action="closeCursorEditModal" aria-label="关闭" style="width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center;">✕</button>
            </div>

            <!-- 主体内容 -->
            <div class="modal-body" style="padding: 20px 22px; max-height: 70vh; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;">
              <input type="hidden" id="cursorEditBindingId">

              <!-- 模型元信息卡片（只读展示） -->
              <div style="background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
                <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
                  <div id="cursorEditModelIcon" style="width: 28px; height: 28px; border-radius: 6px; background: var(--bg-card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    ✦
                  </div>
                  <div style="min-width: 0;">
                    <div style="display: flex; align-items: center; gap: 6px;">
                      <code id="cursorEditExposedIdText" style="font-family: var(--font-mono); font-size: 12px; font-weight: 650; color: var(--text-primary);">--</code>
                      <button class="btn-icon" style="width: 20px; height: 20px; min-width: 20px; border: none; background: transparent; padding: 0; color: var(--text-muted);" onclick="copyTextToClipboard(document.getElementById('cursorEditExposedIdText').textContent, '模型 ID')" title="复制暴露模型 ID">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                      </button>
                    </div>
                    <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">
                      供应商：<span id="cursorEditProviderName" style="color: var(--text-secondary); font-weight: 600;">--</span> · 路由：<span id="cursorEditRouteUidShort" style="font-family: var(--font-mono);">--</span>
                    </div>
                  </div>
                </div>
                <div style="flex-shrink: 0;">
                  <span class="tag" style="background: rgba(37, 99, 235, 0.1); color: var(--accent); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 5px;">OpenAI 兼容</span>
                </div>
              </div>

              <!-- 分组 1: 基本呈现设置 -->
              <div class="cb-edit-section" style="border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--bg-card);">
                <div class="cb-edit-section-header" style="margin-bottom: 12px; display: flex; align-items: center; gap: 6px;">
                  <span class="cb-edit-section-tag" style="font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 4px; background: rgba(37, 99, 235, 0.1); color: var(--accent);">基础</span>
                  <span class="cb-edit-section-title" style="font-size: 12.5px; font-weight: 700; color: var(--text-primary);">显示与启用</span>
                </div>
                <div class="cb-edit-fields-grid" style="display: flex; flex-direction: column; gap: 12px;">
                  <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label for="cursorEditDisplayName" style="font-size: 12px; font-weight: 650; color: var(--text-secondary);">
                      显示名称 <span style="font-size: 12px; color: var(--text-muted); font-weight: normal;">（Cursor 列表下拉选项中展示的文字）</span>
                    </label>
                    <input type="text" id="cursorEditDisplayName" placeholder="例如：Claude 3.5 Sonnet / Gemini 3.8 Flash" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); font-size: 13px; color: var(--text-primary); outline: none;">
                  </div>

                  <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg-input); border-radius: 8px; border: 1px solid var(--border);">
                    <div>
                      <div style="font-size: 12.5px; font-weight: 650; color: var(--text-primary);">向 Cursor 暴露模型</div>
                      <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">关闭后该模型将从 Cursor 列表中隐藏</div>
                    </div>
                    <label class="toggle-switch" title="切换启用状态">
                      <input type="checkbox" id="cursorEditEnabled">
                      <span class="toggle-slider"></span>
                    </label>
                  </div>

                  <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg-input); border-radius: 8px; border: 1px solid var(--border);">
                    <div>
                      <div style="font-size: 12.5px; font-weight: 650; color: var(--text-primary);">第三方图片理解</div>
                      <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">在发送图片时使用网关增强中配置的视觉模型解析图片</div>
                    </div>
                    <label class="toggle-switch" title="切换第三方图片理解">
                      <input type="checkbox" id="cursorEditThirdPartyVision">
                      <span class="toggle-slider"></span>
                    </label>
                  </div>
                </div>
              </div>

              <!-- 分组 2: Cursor 模型调用参数覆写 -->
              <div class="cb-edit-section" style="border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--bg-card);">
                <div class="cb-edit-section-header" style="margin-bottom: 12px; display: flex; align-items: center; gap: 6px;">
                  <span class="cb-edit-section-tag optional" style="font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 4px; background: rgba(16, 185, 129, 0.1); color: #10b981;">可选</span>
                  <span class="cb-edit-section-title" style="font-size: 12.5px; font-weight: 700; color: var(--text-primary);">模型参数配置</span>
                </div>
                <div class="cb-edit-fields-grid" style="display: flex; flex-direction: column; gap: 12px;">
                  <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label for="cursorEditReasoningEffort" style="font-size: 12px; font-weight: 650; color: var(--text-secondary);">
                      思考深度 (Reasoning Effort)
                    </label>
                    <select id="cursorEditReasoningEffort" class="platform-provider-select" style="height: 36px; border-radius: 8px; font-size: 12.5px; padding: 0 12px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-primary); outline: none;">
                      <option value="">跟随上游默认 (无)</option>
                      <option value="low">Low (轻度思考)</option>
                      <option value="medium">Medium (适中思考)</option>
                      <option value="high">High (深度思考)</option>
                    </select>
                  </div>

                  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                      <label for="cursorEditContextWindow" style="font-size: 12px; font-weight: 650; color: var(--text-secondary);">
                        上下文窗口 (Tokens)
                      </label>
                      <input type="number" id="cursorEditContextWindow" placeholder="默认（跟随上游）" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); font-size: 12.5px; color: var(--text-primary); outline: none;">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                      <label for="cursorEditMaxTokens" style="font-size: 12px; font-weight: 650; color: var(--text-secondary);">
                        最大生成 (Tokens)
                      </label>
                      <input type="number" id="cursorEditMaxTokens" placeholder="默认（跟随上游）" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); font-size: 12.5px; color: var(--text-primary); outline: none;">
                    </div>
                  </div>
                </div>
              </div>

            </div>

            <!-- 底部操作栏 -->
            <div class="modal-footer" style="padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; background: var(--bg-card);">
              <button class="btn-ghost secondary" style="height: 36px; padding: 0 16px; font-size: 13px; font-weight: 600; border-radius: 8px;" data-action="closeCursorEditModal">取消</button>
              <button class="btn-primary" style="height: 36px; padding: 0 18px; font-size: 13px; font-weight: 600; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px;" data-action="saveCursorEditModel">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                  <polyline points="17 21 17 13 7 13 7 21"></polyline>
                  <polyline points="7 3 7 8 15 8"></polyline>
                </svg>
                保存修改
              </button>
            </div>
          </div>
        </div>
