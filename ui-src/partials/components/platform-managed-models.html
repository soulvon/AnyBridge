        <!-- ═══════ PAGE: PLATFORM · {{headerTag}} ═══════ -->
        <div class="page" id="page-platform-{{platformId}}" role="tabpanel" aria-labelledby="tab-platforms">
          <section class="platform-console-head glass-card platform-hero-card">
            <div class="platform-console-titlebar">
              <div class="platform-console-icon"><img src="assets/icons/platform-{{platformId}}.svg" alt="{{displayName}}"></div>
              <div class="platform-console-copy">
                <div class="platform-title-line"><h1>{{displayName}}</h1><span class="platform-version-line" id="{{platformId}}-platform-version"></span></div>
              </div>
            </div>
          </section>

          <!-- 列表视图 -->
          <div id="{{prefix}}-list-view">
            <!-- 控制栏 -->
            <div class="control-bar glass-card platform-model-toolbar">
              <!-- 第一行：标题 + 操作按钮 -->
              <div class="platform-model-toolbar-main">
                <div class="platform-model-title-block">
                  <h2>模型列表</h2>
                  <span>{{subtitle}}</span>
                </div>
                <div class="platform-model-toolbar-actions">
                <button class="btn-primary platform-model-btn" data-action="open{{Pascal}}AddModal">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                  </svg>
                  添加模型
                </button>
                <button class="btn-ghost danger cb-bulk-delete-btn" id="{{prefix}}-delete-selected-btn"
 disabled title="删除勾选的模型" data-action="deleteSelected{{Pascal}}Models">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6" />
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                    <path d="M10 11v6M14 11v6" />
                    <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" />
                  </svg>
                  <span class="cb-bulk-delete-label">删除选中</span>
                </button>
                <button class="btn-ghost success platform-model-btn" data-action="save{{Pascal}}Models">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                    <polyline points="17 21 17 13 7 13 7 21" />
                    <polyline points="7 3 7 8 15 8" />
                  </svg>
                  保存
                </button>
                <button class="btn-ghost warn platform-model-btn" id="platform-{{platformId}}-restore"
 data-action="restorePlatform" data-arg="{{platformId}}" title="{{restoreTitle}}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1 4 1 10 7 10" />
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                  </svg>
                  还原备份
                </button>
                </div>
              </div>
              <!-- 第二行：搜索 + 计数 + 工具按钮 -->
              <div class="platform-model-bulk-row">
                <label class="platform-model-search">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  </svg>
                  <input type="text" id="{{prefix}}-model-search" placeholder="搜索模型、供应商或地址"
 data-action="on{{Pascal}}ModelSearch" data-events="input">
                </label>
                <span class="platform-model-count-pill" id="{{prefix}}-model-count">共 0 个</span>
                <span class="platform-model-divider"></span>
                <button class="btn-ghost accent platform-model-btn-icon"
 title="导入" data-click-id="{{prefix}}-import-file">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" y1="3" x2="12" y2="15" />
                  </svg>
                </button>
                <input type="file" id="{{prefix}}-import-file" accept=".json" style="display:none;"
 data-action="import{{Pascal}}Models" data-events="change" data-pass-event>
                <button class="btn-ghost accent platform-model-btn-icon"
 title="导出" data-action="export{{Pascal}}Models">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                  </svg>
                </button>
                <button class="btn-ghost accent platform-model-btn-icon" data-json-toggle="{{prefix}}" aria-pressed="false"
 title="JSON 编辑" data-action="toggle{{Pascal}}JsonEditor">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 18 22 12 16 6" />
                    <polyline points="8 6 2 12 8 18" />
                  </svg>
                </button>
                <button class="btn-ghost accent platform-model-btn-icon"
 title="刷新" data-action="load{{Pascal}}Models">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10" />
                    <polyline points="1 20 1 14 7 14" />
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                  </svg>
                </button>
              </div>
            </div>

            <!-- 模型表格 -->
            <div class="glass-card" style="overflow: hidden; margin-bottom: 20px;" id="{{prefix}}-drop-zone"
              ondragover="{{prefix}}DragOver(event)" ondragleave="{{prefix}}DragLeave(event)" ondrop="{{prefix}}Drop(event)">
              <div class="wb-model-empty" id="{{prefix}}-model-empty"
                style="display:none; padding:40px 20px; text-align:center;">
                <div class="wb-empty-icon">
                  <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <line x1="9" y1="9" x2="15" y2="9" />
                    <line x1="9" y1="13" x2="15" y2="13" />
                    <line x1="9" y1="17" x2="13" y2="17" />
                  </svg>
                </div>
                <div class="wb-empty-title">尚未配置自定义模型</div>
                <div class="wb-empty-subtitle">添加第一个模型，让 {{shortName}} 使用你指定的 AI 供应商与模型能力。</div>
                <button type="button" class="btn-primary wb-empty-action" data-action="open{{Pascal}}AddModal">
                  <svg viewBox="0 0 24 24">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                  </svg>
                  添加模型
                </button>
                <div class="wb-empty-steps">
                  <span class="wb-empty-step"><span class="wb-empty-step-num">1</span> 选择供应商</span>
                  <span class="wb-empty-step"><span class="wb-empty-step-num">2</span> 勾选模型</span>
                  <span class="wb-empty-step"><span class="wb-empty-step-num">3</span> 保存配置</span>
                  <span class="wb-empty-step"><span class="wb-empty-step-num">或</span> 拖入 JSON</span>
                </div>
              </div>
              <table class="wb-model-table" id="{{prefix}}-model-table"
                style="border: none; box-shadow: none; border-radius: 0;">
                <colgroup>
                  <col class="wb-col-select">
                  <col class="wb-col-id">
                  <col class="wb-col-vendor">
                  <col class="wb-col-context">
                  <col class="wb-col-caps">
                  <col class="wb-col-action">
                  <col class="wb-col-enabled">
                </colgroup>
                <thead>
                  <tr>
                    <th class="cb-select-head"><input type="checkbox" id="{{prefix}}-select-all" aria-label="选择当前列表"
 title="选择当前列表" data-action="toggleCbModelSelectAll" data-events="change" data-args="[&quot;{{Pascal}}&quot;]" data-pass-checked></th>
                    <th>模型 ID</th>
                    <th>供应商</th>
                    <th>上下文</th>
                    <th>能力</th>
                    <th>操作</th>
                    <th>启用</th>
                  </tr>
                </thead>
                <tbody id="{{prefix}}-model-tbody"></tbody>
              </table>
            </div>
          </div>

          <!-- JSON 编辑器视图 -->
          <div id="{{prefix}}-json-view" class="glass-card" style="display:none; padding:20px;">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
              <h2 style="font-size:14px; font-weight:700; margin:0;">JSON 编辑器</h2>
              <div style="display:flex; gap:8px;">
                <button class="btn-ghost accent" style="padding:4px 12px; font-size:12px;"
 data-action="format{{Pascal}}Json">格式化</button>
                <button class="btn-primary" style="padding:4px 12px; font-size:12px;"
 data-action="apply{{Pascal}}Json">应用</button>
                <button class="btn-ghost secondary" style="padding:4px 12px; font-size:12px;"
 data-action="toggle{{Pascal}}JsonEditor">返回列表</button>
              </div>
            </div>
            <div id="{{prefix}}-json-editor-wrap" class="wb-json-editor-wrap model-json-panel">
              <textarea id="{{prefix}}-json-editor"
                style="width:100%; min-height:400px; font-family:var(--font-mono); font-size:12px; line-height:1.6; padding:12px; border:1px solid var(--border-strong); border-radius:8px; background:var(--bg-glass); color:var(--text-primary); resize:vertical; tab-size:2;"
                spellcheck="false"></textarea>
              <div id="{{prefix}}-json-error" style="display:none; margin-top:6px; font-size:12px; color:var(--danger);"></div>
            </div>
          </div>

          <p class="platform-hint" style="margin:0 4px;">
            配置文件路径（<span id="{{prefix}}-config-scope-label">用户级</span>）：<code
              id="{{prefix}}-config-path-label">{{configPathLabel}}</code><button type="button" class="platform-config-inline-link" data-action="openPlatformRealConfigModal" data-arg="{{platformId}}" title="查看并编辑配置文件原文"><span>查看配置</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg></button>，{{footerRest}}
          </p>
        </div>
