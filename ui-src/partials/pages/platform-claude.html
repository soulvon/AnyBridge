        <!-- ═══════ PAGE: PLATFORM · CLAUDE CODE ═══════ -->
        <div class="page" id="page-platform-claude-code" role="tabpanel" aria-labelledby="tab-platforms">
          <section class="codex-manager-shell claude-code-manager-shell">
            <section class="platform-console-head glass-card platform-hero-card">
              <div class="platform-console-titlebar">
                <div class="platform-console-icon"><img src="./assets/icons/platform-claude-code.svg" alt="Claude Code"></div>
                <div class="platform-console-copy">
                  <h1>Claude Code</h1>
                  <p class="platform-version-line" id="claude-code-platform-version">检测中…</p>
                </div>
              </div>
            </section>

            <div class="control-bar glass-card model-map-control-bar">
              <div class="model-map-toolbar-main">
                <div class="model-map-title-block">
                  <h2>配置列表</h2>
                  <span>每个配置是一套端点与凭据，切换后重启生效。</span>
                </div>
                <div class="model-map-toolbar-actions">
                  <button class="btn-primary codex-add-config-btn" data-action="openClaudeCodeConfigEditor">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                      stroke-linecap="round" stroke-linejoin="round">
                      <line x1="12" y1="5" x2="12" y2="19" />
                      <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    添加配置
                  </button>
                  <button class="btn-ghost accent codex-refresh-btn" data-action="refreshPlatforms">刷新</button>
                  <button class="btn-ghost warn codex-restore-btn" id="platform-claude-code-restore"
                    data-action="restorePlatform" data-arg="claude-code">还原备份</button>
                </div>
              </div>

              <div class="model-map-bulk-row" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
                <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
                  <label class="model-map-search" style="max-width:340px;width:100%;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <circle cx="11" cy="11" r="8"></circle>
                      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="claude-code-config-search" placeholder="搜索配置、模型或地址"
                      data-action="onClaudeCodeConfigSearch" data-events="input">
                  </label>
                </div>
              </div>
            </div>

            <div class="glass-card codex-card-list-shell">
              <div class="codex-card-list" id="platform-claude-code-config-list">
                <div class="codex-table-empty">正在加载配置…</div>
              </div>
            </div>

            <div class="glass-card" style="padding:14px 20px;margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:16px;">
              <div>
                <strong style="font-size:13.5px;color:var(--text-primary);display:block;margin-bottom:2px;">请求重试</strong>
                <span style="font-size:12px;color:var(--text-muted);">网络异常时的最大重试次数（写入 settings.json）</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                <input id="platform-claude-max-retries" class="field-input" type="number" min="0" max="15" step="1" value="10" style="width:90px;height:34px;text-align:center;" data-action="saveClaudeNativeRetry" data-events="change" data-pass-this>
              </div>
            </div>

            <p class="codex-safe-note">配置文件路径：<code id="claude-code-config-path-label">~/.claude/settings.json</code><button type="button" class="platform-config-inline-link" data-action="openPlatformRealConfigModal" data-arg="claude-code" title="查看并编辑配置文件原文"><span>查看配置</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg></button>。切换后重启 Claude Code 生效，无需保持 AnyBridge 运行。</p>
          </section>
        </div>
