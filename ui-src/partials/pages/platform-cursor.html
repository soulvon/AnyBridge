        <!-- ═══════ PAGE: PLATFORM · CURSOR ═══════ -->
        <div class="page" id="page-platform-cursor" role="tabpanel" aria-labelledby="tab-platforms">
          
          <!-- 1. 顶部控制台 (platform-console-head) -->
          <section class="platform-console-head glass-card platform-hero-card">
            <div class="platform-console-titlebar">
              <div class="platform-console-icon">
                <img id="cursor-platform-icon" src="./assets/icons/platform-cursor.svg" alt="Cursor">
              </div>
              <div class="platform-console-copy">
                <div class="platform-title-line"><h1 id="cursor-platform-title">Cursor</h1><span class="platform-version-line" id="cursor-platform-version"></span></div>
              </div>
            </div>

            <div class="platform-console-actions">
              <button class="btn-primary platform-proxy-primary" id="cursor-main-btn" data-action="cursorPrimaryAction" aria-label="一键接入 Cursor">
                <span class="proxy-btn-action">
                  <svg class="proxy-btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="currentColor" />
                  </svg>
                  <span class="proxy-btn-text" id="cursor-main-btn-text">一键接入</span>
                </span>
              </button>
              <button class="btn-ghost accent platform-refresh-proxy" id="cursorRefreshBtn" data-action="cursorRefreshConsole">刷新状态</button>
              <button class="btn-ghost danger platform-stop-proxy" id="cursorRestoreBtn" data-action="cursorDisableAction" disabled>停止接入</button>
              <button type="button" class="btn-ghost secondary platform-lang-action-btn" id="cursorLangBtn" data-action="openCursorLangModal"
                style="display: none; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; height: 30px; flex-shrink: 0;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;">
                  <path d="m5 8 6 6"/>
                  <path d="m4 14 6-6 2-3"/>
                  <path d="M2 5h12"/>
                  <path d="M7 2h1"/>
                  <path d="m22 22-5-10-5 10"/>
                  <path d="M14 18h6"/>
                </svg>
                <span id="cursorLangBtnText">一键汉化</span>
              </button>
            </div>
          </section>

          <!-- 2. 模型列表工具栏 (model-map-control-bar) -->
          <div class="control-bar glass-card model-map-control-bar">
            <div class="model-map-toolbar-main">
              <div class="model-map-title-block">
                <h2>模型列表</h2>
                <span>添加自定义模型并映射到供应商，接入后可选用。</span>
              </div>
              <div class="model-map-toolbar-actions">
                <button class="btn-primary model-map-command-btn" data-action="openCursorAddPage">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                  添加模型
                </button>
                <button class="btn-ghost accent platform-model-btn-icon" title="刷新模型列表" aria-label="刷新模型列表" data-action="cursorRefreshConsole">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                  </svg>
                </button>
                <button class="btn-ghost secondary model-map-command-btn" title="Cursor 设置（Core 与证书）" data-action="openCursorSettingsModal">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                  </svg>
                  <span>设置</span>
                </button>
              </div>
            </div>

            <div class="model-map-bulk-row" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
              <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
                <label class="model-map-search" style="max-width:340px;width:100%;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  </svg>
                  <input type="text" id="cursor-search-input" placeholder="搜索模型、供应商或地址" oninput="cursorFilterModels(this.value)">
                </label>
                <span class="model-map-count-pill" id="cursor-model-count">共 0 个</span>
              </div>
              <div class="model-map-bulk-actions" style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                <button class="btn-ghost secondary provider-bulk-btn" id="cursor-bulk-select-visible-btn" data-action="cursorToggleSelectAllVisible">选择当前</button>
                <button class="btn-ghost success provider-bulk-btn" id="cursor-bulk-enable-btn" disabled data-action="cursorBulkEnableAction">启用</button>
                <button class="btn-ghost warn provider-bulk-btn" id="cursor-bulk-disable-btn" disabled data-action="cursorBulkDisableAction">停用</button>
                <button class="btn-ghost accent provider-bulk-btn" id="cursor-bulk-vision-btn" disabled data-action="cursorBulkThirdPartyVisionAction">启用第三方图片</button>
                <button class="btn-ghost danger provider-bulk-btn" id="cursor-bulk-remove-btn" disabled data-action="cursorBulkRemoveAction">从 Cursor 移除</button>
              </div>
            </div>
          </div>

          <!-- 3. 数据表格与空状态容器 (复用 cb-model-empty 旗舰空状态) -->
          <div class="glass-card" style="overflow-x: auto; margin-bottom: 20px; border-radius: 14px;">
            <div class="cb-model-empty" id="cursor-model-empty"
              style="display:none; padding:48px 20px; text-align:center; flex-direction:column; align-items:center; justify-content:center;">
              <div class="cb-empty-icon" style="width:72px;height:72px;border-radius:20px;margin-bottom:12px;">
                <svg viewBox="0 0 24 24" style="width:36px;height:36px;">
                  <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                  <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                  <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
              </div>
              <div class="cb-empty-title">尚未配置 Cursor 平台模型</div>
              <div class="cb-empty-subtitle">添加第一个模型，让 Cursor 在右下角模型列表中使用你指定的 AI 供应商与模型能力。</div>
              <button type="button" class="btn-primary cb-empty-action" data-action="openCursorAddPage">
                <svg viewBox="0 0 24 24">
                  <line x1="12" y1="5" x2="12" y2="19" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                添加模型
              </button>
              <div class="cb-empty-steps">
                <span class="cb-empty-step"><span class="cb-empty-step-num">1</span> 选择供应商</span>
                <span class="cb-empty-step"><span class="cb-empty-step-num">2</span> 勾选模型</span>
                <span class="cb-empty-step"><span class="cb-empty-step-num">3</span> 自动同步接入</span>
              </div>
            </div>

            <table class="cb-model-table" id="cursor-model-table" style="border: none; box-shadow: none; border-radius: 0; width: 100%;">
              <colgroup>
                <col class="cb-col-select" style="width: 44px;">
                <col style="width: 22%;">
                <col style="width: 18%;">
                <col style="width: 20%;">
                <col style="width: 88px;">
                <col style="width: 130px;">
                <col style="width: 72px;">
              </colgroup>
              <thead>
                <tr>
                  <th class="cb-select-head" style="text-align: center; padding-left: 14px;">
                    <label class="provider-select-check provider-select-check-table" title="选择当前列表" data-stop data-action="__noop">
                      <input type="checkbox" id="cursorSelectAll" aria-label="选择当前列表" onchange="cursorToggleSelectAll(this.checked)">
                      <span></span>
                    </label>
                  </th>
                  <th>显示名称</th>
                  <th>暴露模型 ID</th>
                  <th>
                    <span class="model-map-display-head" style="display:inline-flex;align-items:center;gap:4px;">
                      <span>所属供应商</span>
                      <button type="button" class="btn-ghost accent model-map-settings-btn" id="cursorProviderTagStyleBtn" title="设置供应商在 Cursor 列表中的展示方式" aria-label="设置供应商展示方式" data-action="openCursorTagStyleModal">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                          <circle cx="12" cy="12" r="3"></circle>
                          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                      </button>
                    </span>
                  </th>
                  <th style="text-align: center;">操作</th>
                  <th style="text-align: center;">
                    <span class="model-map-display-head" style="display:inline-flex;align-items:center;justify-content:center;gap:4px;">
                      <span>图片理解</span>
                      <button class="btn-ghost accent model-map-settings-btn" title="配置图片理解模型" aria-label="配置图片理解模型" data-action="navigateToProxyEnhancement">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                          <circle cx="12" cy="12" r="3"></circle>
                          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                      </button>
                    </span>
                  </th>
                  <th style="text-align: center;">启用</th>
                </tr>
              </thead>
              <tbody id="cursorModelTableBody"></tbody>
            </table>
          </div>

        </div>
