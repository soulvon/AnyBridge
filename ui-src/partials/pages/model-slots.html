        <!-- ═══════ PAGE: MODEL SLOT MANAGEMENT ═══════ -->
        <div class="page" id="page-model-slots" role="tabpanel" aria-labelledby="tab-platforms">
          <div class="model-slots-page">
            <div class="control-bar glass-card model-slots-head">
              <div class="model-slots-title">
                <button class="btn-ghost secondary model-slots-back" title="返回模型映射" data-action="closeInjectedEditor">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"></path>
                    <path d="M12 19l-7-7 7-7"></path>
                  </svg>
                </button>
                <div>
                  <h2>模型槽位管理</h2>
                  <div id="slot-policy-summary">默认全量解锁</div>
                </div>
              </div>
              <div class="model-slots-actions">
                <button class="btn-ghost secondary" data-action="closeInjectedEditor">返回映射</button>
                <button class="btn-primary" id="slot-visibility-save-btn" data-action="saveInjectedFromEditor">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                    <polyline points="17 21 17 13 7 13 7 21"></polyline>
                    <polyline points="7 3 7 8 15 8"></polyline>
                  </svg>
                  <span id="slot-visibility-save-label">保存</span>
                </button>
              </div>
            </div>
            <div class="glass-card model-slots-workspace">
              <div class="model-slots-presets-wrap">
                <div class="model-slots-section-title">
                  <span>显示策略</span>
                  <small>决定 IDE 模型列表里默认展示哪些槽位</small>
                </div>
                <div class="model-slots-presets" role="group" aria-label="槽位显示快速设置">
                  <button class="model-slot-preset" data-mode="mapped" data-label="仅显示已映射槽位"
 data-action="setSlotVisibilityMode" data-arg="mapped">仅显示已映射槽位</button>
                  <button class="model-slot-preset" data-mode="official" data-label="已映射 + 官方模型"
 data-action="setSlotVisibilityMode" data-arg="official">已映射 + 官方模型</button>
                  <button class="model-slot-preset" data-mode="all" data-label="已映射 + 官方 + 全部"
 data-action="setSlotVisibilityMode" data-arg="all">已映射 + 官方 + 全部</button>
                </div>
              </div>
              <div class="model-slots-toolbar">
                <div class="model-slots-bulk-tools">
                  <label class="slot-bulk-select" title="选择当前列表">
                    <input type="checkbox" id="slot-visibility-select-all"
 data-action="toggleSlotVisibilitySelectAll" data-events="change" data-pass-checked>
                    <span id="slot-visibility-select-label">选择</span>
                  </label>
                  <button class="btn-ghost success" id="slot-bulk-enable-btn" data-action="batchSetSlotVisibility" data-args="[true]">启用</button>
                  <button class="btn-ghost warn" id="slot-bulk-disable-btn"
 data-action="batchSetSlotVisibility" data-args="[false]">禁用</button>
                </div>
                <div class="model-slots-search-tools">
                  <div class="model-slots-search">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"
                      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <circle cx="11" cy="11" r="8"></circle>
                      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="injected-search" placeholder="搜索模型名、modelUid 或 apiId"
 data-action="renderInjectedList" data-events="input">
                  </div>
                  <select id="injected-filter" data-action="renderInjectedList" data-events="change">
                    <option value="all">全部</option>
                    <option value="visible">显示中</option>
                    <option value="hidden">已隐藏</option>
                    <option value="mapped">已映射</option>
                    <option value="official">官方模型</option>
                    <option value="unconfigured">未配置</option>
                  </select>
                </div>
              </div>
              <div class="model-slots-list-section">
                <div id="injected-list" class="model-slot-list"></div>
              </div>
            </div>
          </div>
        </div>
