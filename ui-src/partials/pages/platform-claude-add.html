        <!-- ═══════ PAGE: PLATFORM · CLAUDE CODE · 添加模型（独立页面） ═══════ -->
        <div class="page" id="page-platform-claude-add" role="tabpanel" aria-labelledby="tab-platforms">
          <div class="platform-console-hero model-add-hero glass-card">
            <div class="platform-console-titlebar">
              <button class="btn-ghost platform-console-back" data-action="navigateTo" data-arg="platform-claude-code">← 返回</button>
              <div class="platform-console-titlewrap">
                <strong>添加模型 · Claude Code</strong>
                <span class="platform-console-sub">从统一供应商模型池选择并勾选模型，将自动建立 Claude Code 环境变量与设置，并写入 ~/.claude/settings.json。</span>
              </div>
            </div>
          </div>

          <div class="cb-add-layout">
            <!-- 左列：供应商列表 -->
            <aside class="cb-add-sidebar glass-card">
              <div class="cb-add-search">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8" />
                  <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" id="claude-add-search" placeholder="搜索供应商…" data-action="onClaudeAddSearch" data-events="input">
                <div class="provider-sort-control platform-add-sort-control" id="claudeAddSortControl">
                  <button type="button" class="provider-sort-trigger platform-add-sort-trigger" id="claudeAddSortTrigger"
                    aria-haspopup="listbox" aria-expanded="false"
                    aria-controls="claudeAddSortMenu" aria-label="供应商排序" title="供应商排序" data-action="toggleClaudeAddSort" data-pass-event>
                    <svg class="provider-sort-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                      aria-hidden="true">
                      <path d="M8 3v18"></path>
                      <path d="m4 7 4-4 4 4"></path>
                      <path d="M16 21V3"></path>
                      <path d="m20 17-4 4-4-4"></path>
                    </svg>
                    <span id="claudeAddSortLabel">默认排序</span>
                    <svg class="provider-sort-caret" width="13" height="13" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                      aria-hidden="true">
                      <path d="m6 9 6 6 6-6"></path>
                    </svg>
                  </button>
                  <div class="provider-sort-menu platform-add-sort-menu" id="claudeAddSortMenu" role="listbox"
                    aria-label="供应商排序">
                    <button type="button" class="provider-sort-option platform-add-sort-option" role="option"
                      data-sort-mode="default" data-action="chooseClaudeAddSortMode" data-arg="default">默认排序</button>
                    <button type="button" class="provider-sort-option platform-add-sort-option" role="option"
                      data-sort-mode="name-asc" data-action="chooseClaudeAddSortMode" data-arg="name-asc">名称正序</button>
                    <button type="button" class="provider-sort-option platform-add-sort-option" role="option"
                      data-sort-mode="name-desc" data-action="chooseClaudeAddSortMode" data-arg="name-desc">名称反序</button>
                  </div>
                </div>
              </div>
              <div class="cb-add-provider-list" id="claude-add-provider-list"></div>
            </aside>

            <!-- 右列：模型列表 -->
            <section class="cb-add-main">
              <div class="glass-card cb-add-models-card">
                <div class="cb-add-models-head">
                  <div>
                    <div class="cb-add-models-title" id="claude-add-models-title">请选择供应商</div>
                    <div class="cb-add-models-sub" id="claude-add-models-sub">左侧选择一个供应商，右侧将展示其可用模型</div>
                  </div>
                  <div style="display:flex; gap:8px;">
                    <button class="btn-ghost accent" data-action="claudeAddSelectAll">全选</button>
                    <button class="btn-ghost secondary" data-action="claudeAddSelectNone">全不选</button>
                    <button class="btn-primary" id="claude-add-confirm-page"
                      disabled data-action="confirmAddClaudeModelsPage">
                      <svg viewBox="0 0 24 24"
                        style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;">
                        <path d="M20 6L9 17l-5-5" />
                      </svg>
                      <span class="model-action-label"> 保存选择</span>
                    </button>
                  </div>
                </div>
                <div class="cb-add-models-body" id="claude-add-models-list-page">
                  <div class="cb-add-models-empty">请从左侧选择一个供应商</div>
                </div>
              </div>

              <!-- Claude Code 特性卡片：能力适配与网络重试参数 -->
              <div class="glass-card cb-add-caps-card">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                  <div class="cb-add-caps-title" style="margin: 0;">特性与重试参数</div>
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 11.5px; color: var(--text-secondary); font-weight: 600;">重试次数：</span>
                    <input type="number" id="claude-add-max-retries" class="field-input" min="0" max="15" step="1" value="10" style="width: 60px; height: 28px; padding: 0 6px; font-size: 12px; text-align: center;">
                  </div>
                </div>

                <!-- 能力胶囊选项 -->
                <div class="cb-add-caps">
                  <label class="cb-add-cap-chip">
                    <input type="checkbox" id="claude-add-cap-tools" checked>
                    <span>原生工具调用 (Tools)</span>
                  </label>
                  <label class="cb-add-cap-chip">
                    <input type="checkbox" id="claude-add-cap-thinking" checked>
                    <span>深度思考 (Thinking)</span>
                  </label>
                  <label class="cb-add-cap-chip">
                    <input type="checkbox" id="claude-add-cap-vision" checked>
                    <span>视觉多模态 (Vision)</span>
                  </label>
                  <label class="cb-add-cap-chip">
                    <input type="checkbox" id="claude-add-cap-unlock" checked>
                    <span>Claude Code Unlock 兼容</span>
                  </label>
                </div>
              </div>

            </section>
          </div>
        </div>
