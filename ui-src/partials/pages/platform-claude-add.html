        <!-- ═══════ PAGE: PLATFORM · CLAUDE CODE · 添加/编辑配置（独立页面） ═══════ -->
        <div class="page" id="page-platform-claude-add" role="tabpanel" aria-labelledby="tab-platforms">
<!-- @include partials/components/platform-config-hero.html closeAction="closeClaudeCodeConfigEditor" titleId="claude-code-config-page-title" titleText="添加配置 · Claude Code" subId="claude-code-config-page-sub" subText="从现有 Anthropic 供应商创建或自由定制一份可切换的 Claude Code 独立配置。" saveAction="saveClaudeCodeConfigEditor" saveSwitchHtml='<button class="btn-ghost accent" id="claude-code-config-save-switch-btn" data-action="saveClaudeCodeConfigEditor" data-args="[true]"><span>保存并切换</span></button>' -->

          <div class="cb-add-layout">
<!-- @include partials/components/platform-add-sidebar.html asideIdAttr=' id="claude-code-config-source-wrap"' searchId="claude-add-search" onSearchAction="onClaudeAddSearch" prefix="claude" Pascal="Claude" listId="claude-add-provider-list" -->

            <!-- 右列：主工作区（全量垂直滚动，展示完所有设置项） -->
            <section class="cb-add-main codex-add-main">
              <input type="hidden" id="claude-code-config-edit-id">
              <input type="hidden" id="claude-code-config-source-id">
              <textarea id="claude-code-config-models" class="codex-config-models-input" style="display:none;" aria-hidden="true" tabindex="-1"></textarea>

<!-- @include partials/components/platform-config-connection-card.html idPrefix="claude-code" Pascal="ClaudeCode" hintHtml="" namePlaceholder="例如：AnyRouter Claude" urlLabel="Base URL (Anthropic 端点)" urlPlaceholder="https://api.example.com" syncAction="syncClaudeCodeConfigTokenFromSource" keyPlaceholder="sk-..." toggleAction="toggleClaudeCodeKeyVisibility" -->

              <!-- 卡片 2：模型角色映射（CC Switch 规范） -->
              <div class="glass-card cb-add-models-card claude-code-role-card" style="flex: 0 0 auto; overflow: visible !important; position: relative; z-index: 50;">
                <div class="cb-add-models-head" style="padding: 14px 20px;">
                  <div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                      <span style="display: inline-block; width: 3px; height: 14px; background: var(--accent); border-radius: 2px;"></span>
                      <span class="cb-add-models-title">模型角色映射与 1M 上下文</span>
                    </div>
                    <div class="cb-add-models-sub" id="claude-code-config-model-status">配置各角色实际请求模型，勾选 1M 可声明百万上下文支持</div>
                  </div>
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <button type="button" class="btn-ghost" id="claude-code-quick-set-btn" style="height: 28px; padding: 0 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px;" onclick="claudeCodeQuickSetAllModels()" title="使用当前主模型快速铺满所有角色">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
                      </svg>
                      <span>一键设置</span>
                    </button>
                    <button type="button" class="btn-ghost accent" id="claude-code-config-fetch-models-btn"
                      data-action-chain='[{"fn":"fetchClaudeCodeConfigModels"}]' data-action="fetchClaudeCodeConfigModels" data-prevent data-stop>
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                      </svg>
                      <span>拉取模型列表</span>
                    </button>
                  </div>
                </div>

                <!-- 角色网格 -->
                <div style="padding: 14px 20px;">
                  <div class="claude-role-table">
                    <div class="claude-role-row-header">
                      <span>模型角色</span>
                      <span>显示名称 (/model 菜单)</span>
                      <span>实际请求模型 (API 传参)</span>
                      <span style="text-align: center;">声明 1M</span>
                    </div>

<!-- @include partials/components/platform-claude-role-row.html rowClass="claude-role-row" roleLabel="Sonnet" nameId="claude-model-name-sonnet" namePlaceholder="例如 Claude 3.7 Sonnet" nameOnInput="onClaudeRoleFieldInput()" selectId="claude-role-select-sonnet" modelId="claude-model-id-sonnet" boxId="claude-1m-box-sonnet" oneMTitle="勾选后实际请求模型将携带 [1M] 上下文标识" checkId="claude-1m-sonnet" oneMHandler="onClaude1mCheckboxChanged" roleKey="sonnet" -->
<!-- @include partials/components/platform-claude-role-row.html rowClass="claude-role-row" roleLabel="Opus" nameId="claude-model-name-opus" namePlaceholder="例如 Claude 4.7 Opus" nameOnInput="onClaudeRoleFieldInput()" selectId="claude-role-select-opus" modelId="claude-model-id-opus" boxId="claude-1m-box-opus" oneMTitle="勾选后实际请求模型将携带 [1M] 上下文标识" checkId="claude-1m-opus" oneMHandler="onClaude1mCheckboxChanged" roleKey="opus" -->
<!-- @include partials/components/platform-claude-role-row.html rowClass="claude-role-row" roleLabel="Fable" nameId="claude-model-name-fable" namePlaceholder="例如 Claude Fable 5.1" nameOnInput="onClaudeRoleFieldInput()" selectId="claude-role-select-fable" modelId="claude-model-id-fable" boxId="claude-1m-box-fable" oneMTitle="勾选后实际请求模型将携带 [1M] 上下文标识" checkId="claude-1m-fable" oneMHandler="onClaude1mCheckboxChanged" roleKey="fable" -->

                    <!-- 4. Haiku (轻量快速) -->
                    <div class="claude-role-row">
                      <div class="claude-role-badge">Haiku</div>
                      <input id="claude-model-name-haiku" class="field-input" style="height: 36px; padding: 0 10px; font-size: 12.5px;" placeholder="例如 Claude 3.5 Haiku" oninput="onClaudeRoleFieldInput()">
                      <div class="custom-role-select" id="claude-role-select-haiku">
                        <input type="hidden" id="claude-model-id-haiku">
                      </div>
                      <div style="text-align: center; color: var(--text-muted); font-size: 13px; line-height: 36px;">—</div>
                    </div>

                    <!-- 5. Subagent (子智能体) -->
                    <div class="claude-role-row">
                      <div class="claude-role-badge">Subagent</div>
                      <div class="claude-subagent-note">不显示在 /model 菜单</div>
                      <div class="custom-role-select" id="claude-role-select-subagent">
                        <input type="hidden" id="claude-model-id-subagent">
                      </div>
                      <label class="claude-1m-toggle-box" id="claude-1m-box-subagent" title="勾选后实际请求模型将携带 [1M] 上下文标识">
                        <input type="checkbox" id="claude-1m-subagent" onchange="onClaude1mCheckboxChanged('subagent', this.checked)">
                        <span>1M</span>
                      </label>
                    </div>
                  </div>
                </div>

                <!-- 底部：默认兜底模型 -->
                <div style="padding: 14px 20px; border-top: 1px solid var(--border); background: rgba(0,0,0,0.015);">
                  <div style="display: flex; flex-direction: column; gap: 6px;">
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                      <label style="font-size: 12.5px; font-weight: 700; color: var(--text-secondary);">默认兜底模型 (ANTHROPIC_MODEL)</label>
                      <span style="font-size: 12px; color: var(--text-muted);">当终端未匹配具体角色时使用的默认模型</span>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 76px; gap: 12px; align-items: center;">
                      <div class="custom-role-select" id="claude-role-select-fallback">
                        <input type="hidden" id="claude-code-config-model">
                      </div>
                      <label class="claude-1m-toggle-box" id="claude-1m-box-fallback" title="勾选后兜底模型将携带 [1M] 上下文标识">
                        <input type="checkbox" id="claude-1m-fallback" onchange="onClaude1mCheckboxChanged('fallback', this.checked)">
                        <span>1M</span>
                      </label>
                    </div>
                  </div>
                </div>
              </div>

              <!-- 卡片 3：特性与重试参数 -->
              <div class="glass-card" style="padding: 16px 20px; position: relative; z-index: 1;">
                <div style="font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between;">
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="display: inline-block; width: 3px; height: 14px; background: var(--accent); border-radius: 2px;"></span>
                    <span>特性与重试参数</span>
                  </div>
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 12px; color: var(--text-secondary); font-weight: 600;">网络最大重试：</span>
                    <input type="number" id="claude-add-max-retries" class="field-input" min="0" max="15" step="1" value="10" style="width: 70px; height: 30px; padding: 0 6px; font-size: 12px; text-align: center;">
                  </div>
                </div>

                <div class="codex-toggle-grid">
                  <div class="codex-toggle-card">
                    <div class="codex-toggle-info">
                      <span class="codex-toggle-title">原生工具调用</span>
                      <span class="codex-toggle-desc">允许 Claude Code 执行 Bash 脚本、文件编辑和命令行调用</span>
                    </div>
                    <label class="switch" style="flex: 0 0 auto;">
                      <input type="checkbox" id="claude-add-cap-tools" checked>
                      <span class="slider"></span>
                    </label>
                  </div>

                  <div class="codex-toggle-card">
                    <div class="codex-toggle-info">
                      <span class="codex-toggle-title">深度思考</span>
                      <span class="codex-toggle-desc">启用扩展思考能力，提升复杂任务推理深度</span>
                    </div>
                    <label class="switch" style="flex: 0 0 auto;">
                      <input type="checkbox" id="claude-add-cap-thinking" checked>
                      <span class="slider"></span>
                    </label>
                  </div>

                  <div class="codex-toggle-card">
                    <div class="codex-toggle-info">
                      <span class="codex-toggle-title">视觉多模态</span>
                      <span class="codex-toggle-desc">支持传入本地截图与图片文件进行视觉分析理解</span>
                    </div>
                    <label class="switch" style="flex: 0 0 auto;">
                      <input type="checkbox" id="claude-add-cap-vision" checked>
                      <span class="slider"></span>
                    </label>
                  </div>

                  <div class="codex-toggle-card">
                    <div class="codex-toggle-info">
                      <span class="codex-toggle-title">Claude Code Unlock 兼容</span>
                      <span class="codex-toggle-desc">对齐非官方中转渠道的请求头与握手规范，避免连接阻断</span>
                    </div>
                    <label class="switch" style="flex: 0 0 auto;">
                      <input type="checkbox" id="claude-add-cap-unlock" checked>
                      <span class="slider"></span>
                    </label>
                  </div>
                </div>
              </div>

<!-- @include partials/components/platform-real-config-card.html platformId="claude-code" cardStyleExtra="" titleText="实际配置文件 (settings.json)" descText="以大弹窗查看 ~/.claude/settings.json 原文与完整配置结构" -->
            </section>
          </div>
        </div>
