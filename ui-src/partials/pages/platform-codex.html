        <!-- ═══════ PAGE: PLATFORM · CODEX ═══════ -->
        <div class="page" id="page-platform-codex" role="tabpanel" aria-labelledby="tab-platforms">
          <section class="codex-manager-shell">
            <div class="platform-console-hero glass-card codex-manager-hero">
              <div class="platform-console-titlebar">
                <div class="platform-console-icon codex-manager-icon"><img src="assets/icons/platform-codex.svg"
                    alt="Codex"></div>
                <div class="platform-console-titlewrap">
                  <strong>Codex</strong>
                  <span id="platform-codex-headline">OpenAI 终端智能体 CLI · 管理官方与第三方兼容配置</span>
                </div>
              </div>
            </div>

            <div class="control-bar glass-card codex-manager-toolbar">
              <div class="codex-toolbar-left">
                <div class="codex-search">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  </svg>
                  <input type="text" id="codex-config-search" placeholder="搜索配置、模型或地址" data-action="onCodexConfigSearch" data-events="input">
                </div>
              </div>
              <div class="codex-toolbar-actions">
                <button class="btn-primary codex-add-config-btn" data-action="openCodexConfigEditor">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                  </svg>
                  添加配置
                </button>
                <button class="btn-ghost accent codex-refresh-btn" data-action="refreshPlatforms">刷新</button>
                <button class="btn-ghost accent codex-repair-sessions-btn" data-action="repairCodexSessionVisibility" title="对齐会话索引到当前 model_provider，使历史会话重新可见">修复会话历史</button>
                <button class="btn-ghost warn codex-restore-btn" id="platform-codex-restore"
 data-action="restorePlatform" data-arg="codex">还原备份</button>
              </div>
            </div>

            <div class="glass-card codex-card-list-shell">
              <div class="codex-card-list" id="platform-codex-config-list">
                <div class="codex-table-empty">正在加载配置…</div>
              </div>
            </div>

            <div class="glass-card" style="padding:14px 20px;margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
              <div>
                <strong style="font-size:13.5px;color:var(--text-primary);display:block;margin-bottom:2px;">请求重试</strong>
                <span style="font-size:12px;color:var(--text-muted);">网络异常时的自动重试次数（写入 config.toml）</span>
              </div>
              <div style="display:flex;align-items:center;gap:16px;">
                <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);font-weight:600;">
                  <span>常规重试</span>
                  <input id="platform-codex-request-max-retries" class="field-input" type="number" min="0" max="100" step="1" value="10" style="width:80px;height:34px;text-align:center;" data-action="saveCodexNativeRetry" data-events="change" data-pass-this>
                </label>
                <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);font-weight:600;">
                  <span>流式重试</span>
                  <input id="platform-codex-stream-max-retries" class="field-input" type="number" min="0" max="100" step="1" value="10" style="width:80px;height:34px;text-align:center;" data-action="saveCodexNativeRetry" data-events="change" data-pass-this>
                </label>
              </div>
            </div>

            <p class="codex-safe-note">配置文件路径：<code id="codex-config-path-label">~/.codex/config.toml</code><button type="button" class="btn-ghost accent" data-action="openPlatformRealConfigModal" data-arg="codex" style="height: 22px; padding: 0 8px; font-size: 11px; margin-left: 8px;">编辑查看</button>。切换后重启 Codex 生效，AnyBridge 会保留 MCP、桌面和项目配置。</p>
          </section>
        </div>
