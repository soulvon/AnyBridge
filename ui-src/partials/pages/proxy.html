        <!-- ═══════ PAGE: PROXY ═══════ -->
        <div class="page" id="page-proxy" role="tabpanel" aria-labelledby="tab-proxy">
          <section class="proxy-console-page">
            <div class="proxy-console-hero glass-card">
              <div class="proxy-console-title">
                <span class="dot"></span>
                <div>
                  <h1>本地代理</h1>
                  <p>统一管理 AnyBridge sidecar、兼容入口、本地 key 和代理增强。</p>
                </div>
              </div>
              <div class="proxy-console-actions">
                <button class="btn-primary" id="globalProxyStartBtn" data-action="startGlobalProxyService">启动代理</button>
                <button class="btn-ghost accent" id="globalProxyRestartBtn" data-action="restartGlobalProxyService">重启代理</button>
                <button class="btn-ghost danger" id="globalProxyStopBtn" data-action="stopGlobalProxyService">停止代理</button>
              </div>
            </div>

            <div class="proxy-console-tabs" role="tablist" aria-label="代理配置">
              <button type="button" class="proxy-console-tab active" data-proxy-panel="overview" aria-selected="true">概览</button>
              <button type="button" class="proxy-console-tab" data-proxy-panel="routes" aria-selected="false">模型列表</button>
              <button type="button" class="proxy-console-tab" data-proxy-panel="enhancement" aria-selected="false">代理增强</button>
              <button type="button" class="proxy-console-tab" data-proxy-panel="stats" aria-selected="false">统计</button>
              <button type="button" class="proxy-console-tab" data-proxy-panel="logs" aria-selected="false">日志</button>
            </div>

            <div class="proxy-console-section active" data-proxy-section="overview">
              <div class="proxy-console-grid proxy-console-grid-single">

                <section class="proxy-console-card glass-card ">
                  <div class="proxy-console-card-head">
                    <div>
                      <h2>连接配置</h2>
                    </div>
                  </div>

                  <div class="proxy-section">
                    <div class="proxy-local-key-box">
                      <div>
                        <span>API 地址 (Base URL)</span>
                        <div class="proxy-value-with-copy">
                          <strong id="localProxyUnifiedUrl">http://127.0.0.1:{port}</strong>
                          <button type="button" class="proxy-value-copy-btn" data-action="copyLocalProxyValue" data-arg="unified" title="复制 API 地址">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                          </button>
                        </div>
                      </div>
                    </div>

                    <div class="proxy-local-key-box" style="margin-top: 10px;">
                      <div>
                        <span>本地 Key</span>
                        <div class="proxy-value-with-copy">
                          <strong id="localProxyKeyValue">未生成</strong>
                          <button type="button" class="proxy-value-copy-btn" data-action="copyLocalProxyValue" data-arg="key" title="复制本地 Key">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                          </button>
                        </div>
                      </div>
                      <div class="proxy-local-key-actions">
                        <button class="btn-ghost accent" data-action="regenerateLocalProxyKey">重新生成</button>
                      </div>
                    </div>

                    <div class="proxy-ports-grid proxy-ports-grid-single" style="margin-top: 14px;">
                      <div class="proxy-port-field">
                        <label>API 服务端口</label>
                        <input id="localProxyPortInput" class="input-sm" type="number" min="1" max="65535" value="7450">
                      </div>
                      <button class="btn-ghost accent" data-action="saveLocalProxyPorts" data-arg="proxy">保存端口</button>
                    </div>
                  </div>

                  <div class="proxy-section-divider"></div>

                  <div class="proxy-section">
                    <div class="proxy-section-title">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                      </svg>
                      启动偏好
                    </div>
                    <div class="proxy-preference-row">
                      <div>
                        <span>启动时自动运行</span>
                        <strong>应用打开时自动启动本地代理</strong>
                      </div>
                      <div class="toggle-sm" data-config-toggle="AUTO_START_PROXY" role="switch" aria-label="启动时自动运行代理"></div>
                    </div>
                  </div>
                </section>

            </div>
            </div>

            <div class="proxy-console-section" data-proxy-section="routes">
              <section class="proxy-console-card glass-card proxy-routes-card">
                <div class="proxy-routes-hero">
                  <div class="proxy-routes-title">
                    <h2>模型列表</h2>
                    <p>管理本地代理对外暴露的模型。请求里的 model 必须命中这里的模型 ID。</p>
                  </div>
                </div>
                <div class="proxy-routes-toolbar">
                  <label class="proxy-routes-search">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                      stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <circle cx="11" cy="11" r="8"></circle>
                      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input id="proxyRoutesSearch" type="text" placeholder="搜索模型、供应商或地址"
 data-action="renderProxyRoutes" data-events="input">
                  </label>
                  <span class="model-map-count-pill" id="proxyRoutesBulkCount">共 0 个</span>
                  <div class="proxy-routes-command-group model-map-bulk-actions">
                    <button class="btn-primary proxy-route-add-btn" data-action="openProxyRouteEditor">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                      </svg>
                      添加模型
                    </button>
                    <button class="btn-ghost secondary provider-bulk-btn" id="proxyRoutesSelectVisibleBtn"
 disabled data-action="toggleVisibleProxyRouteSelection">选择当前</button>
                    <button class="btn-ghost success provider-bulk-btn" id="proxyRoutesBulkEnableBtn"
 disabled data-action="batchSetSelectedProxyRoutesEnabled" data-args="[true]">启用</button>
                    <button class="btn-ghost warn provider-bulk-btn" id="proxyRoutesBulkDisableBtn"
 disabled data-action="batchSetSelectedProxyRoutesEnabled" data-args="[false]">停用</button>
                    <button class="btn-ghost accent provider-bulk-btn" id="proxyRoutesBulkVisionBtn"
 disabled data-action="batchSetSelectedProxyRoutesThirdPartyVision" data-args="[true]">启用第三方图片</button>
                    <button class="btn-ghost danger provider-bulk-btn proxy-routes-delete-selected" id="proxyRoutesDeleteSelectedBtn"
 disabled data-action="deleteSelectedProxyRoutes">
                      <span class="proxy-routes-delete-label">删除选中</span>
                    </button>
                    <button class="btn-ghost accent proxy-route-icon-btn" title="刷新"
 aria-label="刷新模型列表" data-action="loadProxyRoutes">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                      </svg>
                    </button>
                  </div>
                </div>
                <div class="proxy-routes-table-wrap">
                  <table class="proxy-routes-table">
                    <colgroup>
                      <col class="proxy-route-col-select">
                      <col class="proxy-route-col-id">
                      <col class="proxy-route-col-upstream">
                      <col class="proxy-route-col-capabilities">
                      <col class="proxy-route-col-actions">
                      <col class="proxy-route-col-vision">
                      <col class="proxy-route-col-enabled">
                    </colgroup>
                    <thead>
                      <tr>
                        <th class="proxy-route-select-head model-map-select-head">
                          <label class="provider-select-check provider-select-check-table" title="选择当前列表" data-stop data-action="__noop">
                            <input type="checkbox" id="proxyRoutesSelectAll" aria-label="选择当前列表" data-action="toggleProxyRoutesSelectAll" data-events="change" data-pass-checked>
                            <span></span>
                          </label>
                        </th>
                        <th>
                          <span class="model-map-display-head">
                            <span>模型 ID</span>
                            <button class="btn-ghost accent model-map-settings-btn"
 title="批量重命名模型 ID（加前后缀/换名）" aria-label="批量重命名模型 ID" data-action="openProxyRouteRenameModal">
                              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="3"></circle>
                                <path
                                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
                                </path>
                              </svg>
                            </button>
                          </span>
                        </th>
                        <th>上游</th>
                        <th>能力</th>
                        <th>操作</th>
                        <th>
                          <span class="model-map-display-head">
                            <span>第三方图片理解</span>
                            <button class="btn-ghost accent model-map-settings-btn"
 title="配置图片理解模型" aria-label="配置图片理解模型" data-action="navigateToProxyEnhancement">
                              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="3"></circle>
                                <path
                                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
                                </path>
                              </svg>
                            </button>
                          </span>
                        </th>
                        <th>启用</th>
                      </tr>
                    </thead>
                    <tbody id="proxyRoutesTableBody">
                      <tr><td colspan="7" class="proxy-routes-empty">正在加载模型列表...</td></tr>
                    </tbody>
                  </table>
                </div>
              </section>
            </div>

            <div class="proxy-console-section" data-proxy-section="enhancement">
              <div id="proxyEnhancementMount"></div>
            </div>

            <div class="proxy-console-section" data-proxy-section="stats">
              <div id="proxyStatsMount" class="proxy-stats-mount"></div>
            </div>

            <div class="proxy-console-section" data-proxy-section="logs">
              <div id="proxyLogsMount" class="proxy-logs-mount"></div>
            </div>
          </section>
        </div>
