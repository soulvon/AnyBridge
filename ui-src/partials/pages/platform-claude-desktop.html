        <!-- ═══════ PAGE: PLATFORM · CLAUDE DESKTOP ═══════ -->
        <div class="page" id="page-platform-claude-desktop" role="tabpanel" aria-labelledby="tab-platforms">
          <section class="codex-manager-shell claude-desktop-manager-shell">
            <div class="platform-console-hero glass-card codex-manager-hero" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">
              <div class="platform-console-titlebar">
                <div class="platform-console-icon codex-manager-icon"><img src="assets/icons/platform-claude-desktop.svg"
                    alt="Claude Desktop"></div>
                <div class="platform-console-titlewrap">
                  <strong>Claude Desktop</strong>
                  <span id="platform-claude-desktop-headline">Anthropic 桌面客户端 · 管理本地路由与角色模型映射</span>
                </div>
              </div>
              <div class="platform-console-actions" id="claude-desktop-hero-actions">
                <button type="button" class="btn-ghost success claude-desktop-mode-badge-btn" id="claude-desktop-hero-mode-btn"
                  onclick="onClaudeDesktopHeroModeClick()" title="点击查看或切换连接模式"
                  style="height: 36px; padding: 0 14px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; border-radius: 8px; cursor: pointer; transition: all 0.2s ease;">
                  <span class="claude-desktop-mode-dot" style="width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 8px rgba(16,185,129,0.6);display:inline-block;"></span>
                  <span>代理模式 (本地路由)</span>
                </button>
              </div>
            </div>

            <div class="control-bar glass-card codex-manager-toolbar">
              <div class="codex-toolbar-left">
                <div class="codex-search">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  </svg>
                  <input type="text" id="claude-desktop-config-search" placeholder="搜索配置、模型或地址"
                    data-action="onClaudeDesktopConfigSearch" data-events="input">
                </div>
              </div>
              <div class="codex-toolbar-actions">
                <button class="btn-primary codex-add-config-btn" data-action="openClaudeDesktopAddModal">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                  </svg>
                  添加配置
                </button>
                <button class="btn-ghost accent codex-refresh-btn" data-action="refreshClaudeDesktopAction">刷新</button>
                <button class="btn-ghost warn codex-restore-btn" id="platform-claude-desktop-restore"
                  data-action="restorePlatform" data-arg="claude-desktop">还原官方模式</button>
              </div>
            </div>

            <div class="glass-card codex-card-list-shell">
              <div class="codex-card-list" id="platform-claude-desktop-config-list">
                <div class="codex-table-empty">正在加载配置…</div>
              </div>
            </div>

            <p class="codex-safe-note" style="margin-top: 14px;">配置文件路径：<code id="claude-desktop-config-path-label" class="reveal-path" title="点击打开所在文件夹">Claude-3p/claude_desktop_config.json</code><button type="button" class="btn-ghost accent" data-action="openPlatformRealConfigModal" data-arg="claude-desktop" style="height: 22px; padding: 0 8px; font-size: 11px; margin-left: 8px;">编辑查看</button>。切换后重启 Claude Desktop 生效，使用代理模型需保持 AnyBridge 运行。</p>
          </section>
        </div>
