        <!-- ═══════ PAGE: STATS（用量统计） ═══════ -->
        <div class="page" id="page-stats" role="tabpanel" aria-labelledby="tab-stats">

          <section class="stats-page">

            <header class="stats-head">
              <div class="stats-head-copy">
                <h1 class="stats-title">统计</h1>
                <p class="stats-sub">网关账本记录路由与重试，本地日志覆盖未经过代理的用量；两本账并列展示，不合并</p>
              </div>
              <div class="stats-controls">
                <div class="stats-range" role="tablist" aria-label="时间范围">
                  <button type="button" class="stats-range-btn" data-stats-range="1" role="tab" aria-selected="false">今日</button>
                  <button type="button" class="stats-range-btn active" data-stats-range="7" role="tab" aria-selected="true">近 7 天</button>
                  <button type="button" class="stats-range-btn" data-stats-range="30" role="tab" aria-selected="false">近 30 天</button>
                  <button type="button" class="stats-range-btn" data-stats-range="0" role="tab" aria-selected="false">全部</button>
                </div>
                <button type="button" class="stats-refresh" id="statsRefreshBtn" title="重新读取统计">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"></path>
                    <path d="M21 3v5h-5"></path>
                    <path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"></path>
                    <path d="M3 21v-5h5"></path>
                  </svg>
                  <span>刷新</span>
                </button>
              </div>
            </header>

            <div class="stats-kpi-grid">
              <article class="stats-kpi">
                <div class="stats-kpi-head">
                  <span class="stats-kpi-label">请求数</span>
                  <span class="stats-kpi-trend" id="statsTrendRequests">—</span>
                </div>
                <div class="stats-kpi-value" id="statsKpiRequests">—</div>
                <div class="stats-kpi-sub" id="statsKpiRequestsSub">等待数据</div>
                <svg class="stats-spark" id="statsSparkRequests" viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true"></svg>
              </article>
              <article class="stats-kpi">
                <div class="stats-kpi-head">
                  <span class="stats-kpi-label">Token</span>
                  <span class="stats-kpi-trend" id="statsTrendTokens">—</span>
                </div>
                <div class="stats-kpi-value" id="statsKpiTokens">—</div>
                <div class="stats-kpi-sub" id="statsKpiTokensSub">输入 / 输出 / 缓存</div>
                <svg class="stats-spark" id="statsSparkTokens" viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true"></svg>
              </article>
              <article class="stats-kpi">
                <div class="stats-kpi-head">
                  <span class="stats-kpi-label">估算费用</span>
                  <span class="stats-kpi-trend" id="statsTrendCost">—</span>
                </div>
                <div class="stats-kpi-value" id="statsKpiCost">—</div>
                <div class="stats-kpi-sub" id="statsKpiCostSub">按模型单价估算，非账单</div>
                <svg class="stats-spark" id="statsSparkCost" viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true"></svg>
              </article>
              <article class="stats-kpi">
                <div class="stats-kpi-head">
                  <span class="stats-kpi-label">成功率</span>
                  <span class="stats-kpi-trend" id="statsTrendSuccess">—</span>
                </div>
                <div class="stats-kpi-value" id="statsKpiSuccess">—</div>
                <div class="stats-kpi-sub" id="statsKpiSuccessSub">网关侧口径</div>
                <svg class="stats-spark" id="statsSparkSuccess" viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true"></svg>
              </article>
            </div>

            <section class="stats-panel">
              <div class="stats-panel-head">
                <div>
                  <div class="stats-panel-title">每日用量</div>
                  <div class="stats-panel-sub" id="statsChartSub">柱为当日 Token，折线为请求数</div>
                </div>
                <div class="stats-seg" role="tablist" aria-label="图表指标">
                  <button type="button" class="stats-seg-btn active" data-stats-metric="tokens" role="tab" aria-selected="true">Token</button>
                  <button type="button" class="stats-seg-btn" data-stats-metric="requests" role="tab" aria-selected="false">请求</button>
                  <button type="button" class="stats-seg-btn" data-stats-metric="cost" role="tab" aria-selected="false">费用</button>
                </div>
              </div>
              <div class="stats-chart" id="statsTrendChart" aria-live="polite">
                <div class="stats-empty">正在读取统计…</div>
              </div>
            </section>

            <section class="stats-panel">
              <div class="stats-panel-head">
                <div class="stats-panel-title">排行</div>
                <div class="stats-seg" role="tablist" aria-label="排行维度">
                  <button type="button" class="stats-seg-btn active" data-stats-rank="model" role="tab" aria-selected="true">模型</button>
                  <button type="button" class="stats-seg-btn" data-stats-rank="account" role="tab" aria-selected="false">账号</button>
                  <button type="button" class="stats-seg-btn" data-stats-rank="source" role="tab" aria-selected="false">来源</button>
                </div>
              </div>
              <div class="stats-table" id="statsRankTable">
                <div class="stats-empty">暂无数据</div>
              </div>
            </section>

            <section class="stats-panel">
              <div class="stats-panel-head">
                <div>
                  <div class="stats-panel-title">最近请求</div>
                  <div class="stats-panel-sub">网关实时快照；请求侧与上游模型不同时显示箭头</div>
                </div>
              </div>
              <div class="stats-recent" id="statsRecent">
                <div class="stats-empty">暂无请求记录</div>
              </div>
            </section>

          </section>
        </div>
