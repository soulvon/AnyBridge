        <!-- ═══════ PAGE: STATS（用量与账本） ═══════ -->
        <div class="page" id="page-stats" role="tabpanel" aria-labelledby="tab-stats">

          <section class="us-view">

            <!-- 1. 顶部控制头 (对标 magpie .usage-head) -->
            <header class="us-head">
              <div class="us-head-left">
                <span class="us-head-title">用量统计</span>
                <span class="us-source-badge" id="statsLiveBadge">实时账本</span>
              </div>

              <!-- 时间范围分段药丸 -->
              <div class="us-segs" role="tablist" aria-label="时间周期">
                <button type="button" class="us-seg-opt" data-stats-range="1" role="tab" aria-selected="false">今日</button>
                <button type="button" class="us-seg-opt on" data-stats-range="7" role="tab" aria-selected="true">7 天</button>
                <button type="button" class="us-seg-opt" data-stats-range="30" role="tab" aria-selected="false">30 天</button>
                <button type="button" class="us-seg-opt" data-stats-range="0" role="tab" aria-selected="false">全部</button>
              </div>

              <div class="us-head-grow"></div>

              <!-- 顶部汇总总支出 (对标 magpie .usage-cost: 估算费用在右上角静默呈现) -->
              <div class="us-cost-sum" id="statsCostHead">
                <span>总估算支出</span>
                <b id="statsKpiCost">$0.00</b>
              </div>

              <!-- 刷新按钮 -->
              <button type="button" class="us-btn-refresh" id="statsRefreshBtn" title="同步旁路客户端并重载">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"></path>
                  <path d="M21 3v5h-5"></path>
                  <path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"></path>
                  <path d="M3 21v-5h5"></path>
                </svg>
              </button>
            </header>

            <!-- 2. 四联无缝紧凑网格 (1px 缝隙边框，对标 magpie .stats + .kpi) -->
            <div class="us-stats-grid">
              <!-- KPI 1: Tokens -->
              <div class="us-kpi">
                <div class="us-kpi-main">
                  <b id="statsKpiTokens">—</b>
                </div>
                <span class="us-kpi-label">TOKEN 消耗</span>
                <small id="statsKpiTokensSub">0 in · 0 out</small>
              </div>

              <!-- KPI 2: 缓存命中 (Cache Read) -->
              <div class="us-kpi">
                <div class="us-kpi-main">
                  <b id="statsKpiCache">—</b>
                </div>
                <span class="us-kpi-label">缓存读取</span>
                <small id="statsKpiCacheSub">命中率 0%</small>
              </div>

              <!-- KPI 3: 请求频次 (Calls & Retried) -->
              <div class="us-kpi">
                <div class="us-kpi-main">
                  <b id="statsKpiRequests">—</b>
                </div>
                <span class="us-kpi-label">请求调用</span>
                <small id="statsKpiRequestsSub">0 失败 · 0 重试</small>
              </div>

              <!-- KPI 4: 成功率 (网关侧) -->
              <div class="us-kpi">
                <div class="us-kpi-main">
                  <b id="statsKpiSuccess">—</b>
                </div>
                <span class="us-kpi-label">健康度</span>
                <small id="statsKpiSuccessSub">网关无阻断</small>
              </div>
            </div>

            <!-- 3. 时间线趋势卡片 (对标 magpie .chart: 72px 极简双层柱条 + 峰值提示 + 底部分布刻度) -->
            <div class="us-chart-box">
              <div class="us-chart-header">
                <div class="us-chart-title-wrap">
                  <span class="us-chart-title">每日消耗走势</span>
                  <span class="us-chart-legend">
                    <i class="dot-in"></i> 输入
                    <i class="dot-out"></i> 输出
                  </span>
                </div>
                <div class="us-chart-peak" id="statsChartPeak">峰值: 0</div>
              </div>

              <div class="us-chart-bars-track" id="statsChartBars">
                <!-- 动态填充 .us-bar 柱形 -->
              </div>

              <div class="us-chart-labels" id="statsChartLabels">
                <!-- 动态填充时间刻度 -->
              </div>
            </div>

            <!-- 4. 统计分组排行列表 (对标 magpie .row.stat: 谁 / 进度细线 / 吞吐数值 / 费用估算) -->
            <div class="us-section-group">
              <div class="us-section-head">
                <span class="us-sec-title">用量归因与排行</span>
                <div class="us-segs us-segs-sm" role="tablist" aria-label="排行视图">
                  <button type="button" class="us-seg-opt on" data-stats-rank="model" role="tab" aria-selected="true">模型</button>
                  <button type="button" class="us-seg-opt" data-stats-rank="account" role="tab" aria-selected="false">CPA 账号</button>
                  <button type="button" class="us-seg-opt" data-stats-rank="source" role="tab" aria-selected="false">来源客户端</button>
                </div>
              </div>

              <div class="us-rank-list" id="statsRankList">
                <div class="us-none">正在读取排行榜...</div>
              </div>
            </div>

            <!-- 5. 挂载数据源总览 (微型卡片) -->
            <div class="us-section-group">
              <div class="us-section-head">
                <span class="us-sec-title">数据通道源</span>
                <span class="us-sec-meta" id="statsSourcesMeta">旁路日志实时挂载</span>
              </div>
              <div class="us-sources-deck" id="statsSourcesDeck">
                <!-- 动态填充微卡片 -->
              </div>
            </div>

            <!-- 6. 实时请求审计流 (对标 magpie .led) -->
            <div class="us-section-group">
              <div class="us-section-head">
                <span class="us-sec-title">实时请求审计 (最近 20 条)</span>
                <span class="us-sec-meta">路由链路与错误拦截</span>
              </div>

              <div class="us-ledger-wrap">
                <table class="us-ledger-table" aria-label="请求调用列表">
                  <thead>
                    <tr>
                      <th style="width: 85px;">时间</th>
                      <th style="width: 65px;">状态</th>
                      <th style="width: 120px;">通道</th>
                      <th>模型映射 (请求 → 实际)</th>
                      <th style="width: 90px; text-align: right;">消耗</th>
                    </tr>
                  </thead>
                  <tbody id="statsRecentTbody">
                    <tr><td colspan="5" class="us-none">当前无即时会话</td></tr>
                  </tbody>
                </table>
              </div>
            </div>

          </section>
        </div>
