        <!-- ═══════ PAGE: PLATFORM · CLAUDE DESKTOP · 添加/编辑配置（独立页面） ═══════ -->
        <div class="page" id="page-platform-claude-desktop-add" role="tabpanel" aria-labelledby="tab-platforms">
<!-- @include partials/components/platform-config-hero.html closeAction="closeClaudeDesktopConfigEditor" titleId="claude-desktop-config-page-title" titleText="添加配置 · Claude Desktop" subId="claude-desktop-config-page-sub" subText="配置桌面端本地路由与各档位角色的模型映射。" saveAction="saveClaudeDesktopConfigEditor" saveSwitchHtml='<button class="btn-ghost accent" id="claude-desktop-config-save-switch-btn" data-action="saveClaudeDesktopConfigEditor" data-args="[true]"><span>保存并切换</span></button>' -->

          <div class="cb-add-layout">
<!-- @include partials/components/platform-add-sidebar.html asideIdAttr=' id="claude-desktop-config-source-wrap"' searchId="claude-desktop-source-search-input" onSearchAction="onClaudeDesktopSourceSearch" prefix="claudeDesktop" Pascal="ClaudeDesktop" listId="claude-desktop-config-source-list" -->

            <!-- 右列：主工作区（全量垂直滚动，展示完所有设置项） -->
            <section class="cb-add-main codex-add-main">
              <input type="hidden" id="claude-desktop-config-edit-id">
              <input type="hidden" id="claude-desktop-config-source-id">

              <!-- 卡片 1：基础连接信息 -->
              <div class="glass-card" style="padding: 16px 20px;">
                <div style="font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 14px; display: flex; align-items: center;">
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="display: inline-block; width: 3px; height: 14px; background: var(--accent); border-radius: 2px;"></span>
                    <span>基础连接信息</span>
                  </div>
                </div>

                <div style="display: grid; grid-template-columns: minmax(180px, 1.1fr) minmax(260px, 1.5fr); gap: 14px; margin-bottom: 14px;">
                  <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label style="font-size: 12.5px; font-weight: 700; color: var(--text-secondary);">配置名称</label>
                    <input id="claude-desktop-config-name" class="field-input" style="height: 36px; padding: 0 12px; font-size: 13px;" placeholder="例如：CPA / 薄荷 / AnyRouter"
                      data-action="syncClaudeDesktopRawConfigFromFields" data-events="input">
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label style="font-size: 12.5px; font-weight: 700; color: var(--text-secondary);">连接模式</label>
                    <select id="claude-desktop-config-mode" class="field-input" style="height: 36px; padding: 0 12px; font-size: 13px;" data-action="syncClaudeDesktopRawConfigFromFields" data-events="change">
                      <option value="proxy">本地路由映射（推荐，支持任意供应商与模型）</option>
                      <option value="direct">直连模式（要求供应商原生兼容 Anthropic 角色）</option>
                    </select>
                  </div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px;">
                  <label style="font-size: 12.5px; font-weight: 700; color: var(--text-secondary);">请求地址</label>
                  <input id="claude-desktop-config-base-url" class="field-input" style="height: 36px; padding: 0 12px; font-size: 13px;" placeholder="http://127.0.0.1:7450/v1"
                    data-action="syncClaudeDesktopRawConfigFromFields" data-events="input">
                  <span style="font-size: 12px; color: var(--text-muted);">填写兼容 Claude API 的服务端点地址，不要以斜杠结尾</span>
                </div>

                <div style="display: flex; flex-direction: column; gap: 6px;">
                  <div style="display: flex; align-items: center; justify-content: space-between;">
                    <label style="font-size: 12.5px; font-weight: 700; color: var(--text-secondary);">API Key</label>
                    <button type="button" class="btn-ghost" id="claude-desktop-config-sync-token-btn"
                      data-action="syncClaudeDesktopConfigTokenFromSource" style="padding: 2px 10px; height: 26px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px;" title="从关联的来源供应商拉取最新令牌和地址">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                      </svg>
                      <span>同步来源令牌</span>
                    </button>
                  </div>
                  <div class="codex-input-password-wrap" style="position: relative; width: 100%;">
                    <input id="claude-desktop-config-api-key" class="field-input" type="password" style="height: 36px; padding: 0 40px 0 12px; font-size: 13px; width: 100%; box-sizing: border-box;" placeholder="sk-... 或留空" autocomplete="off"
                      data-action="syncClaudeDesktopRawConfigFromFields" data-events="input">
                    <button type="button" class="codex-password-toggle-btn" id="claude-desktop-config-api-key-toggle"
                      data-action="toggleClaudeDesktopKeyVisibility" title="显示或隐藏 API Key" aria-label="显示或隐藏 API Key" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; width: 26px; height: 26px;">
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>

              <!-- 卡片 2：模型映射与 1M 上下文 -->
              <div class="glass-card claude-desktop-role-card" id="claude-desktop-role-card" style="padding: 16px 20px; overflow: visible !important; position: relative; z-index: 50;">
                <div style="font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;">
                  <div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                      <span style="display: inline-block; width: 3px; height: 14px; background: var(--accent); border-radius: 2px;"></span>
                      <span>模型角色映射与 1M 上下文</span>
                    </div>
                    <div class="cb-add-models-sub" id="claude-desktop-config-model-status" style="margin-top: 4px; font-size: 12px; font-weight: normal; color: var(--text-muted);">为各档填写实际请求模型，菜单显示名可写品牌名；留空的档自动沿用已填档</div>
                  </div>
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <button type="button" class="btn-ghost accent" data-action="claudeDesktopQuickSetAllModels" style="height: 28px; padding: 0 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px;">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
                      </svg>
                      <span>一键设置</span>
                    </button>
                    <button type="button" class="btn-ghost accent" id="claude-desktop-config-fetch-models-btn" data-action="fetchClaudeDesktopConfigModels" style="height: 28px; padding: 0 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px;">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                      </svg>
                      <span>获取模型列表</span>
                    </button>
                  </div>
                </div>

                <div class="claude-role-table">
                  <div class="claude-desktop-role-row-header">
                    <span>模型角色</span>
                    <span>菜单显示名</span>
                    <span>实际请求模型</span>
                    <span style="text-align: center;">声明支持 1M</span>
                  </div>

<!-- @include partials/components/platform-claude-role-row.html rowClass="claude-desktop-role-row" roleLabel="Sonnet" nameId="claude-desktop-config-sonnet-name" namePlaceholder="例如：Claude Opus 4.8 或 DeepSeek" nameOnInput="syncClaudeDesktopRawConfigFromFields()" selectId="claude-desktop-role-select-sonnet" modelId="claude-desktop-config-sonnet" boxId="claude-desktop-1m-box-sonnet" oneMTitle="勾选后实际请求模型将声明 1M 上下文支持" checkId="claude-desktop-1m-sonnet" oneMHandler="onClaudeDesktop1mChange" roleKey="sonnet" -->
<!-- @include partials/components/platform-claude-role-row.html rowClass="claude-desktop-role-row" roleLabel="Opus" nameId="claude-desktop-config-opus-name" namePlaceholder="例如：Claude Opus 5" nameOnInput="syncClaudeDesktopRawConfigFromFields()" selectId="claude-desktop-role-select-opus" modelId="claude-desktop-config-opus" boxId="claude-desktop-1m-box-opus" oneMTitle="勾选后实际请求模型将声明 1M 上下文支持" checkId="claude-desktop-1m-opus" oneMHandler="onClaudeDesktop1mChange" roleKey="opus" -->
<!-- @include partials/components/platform-claude-role-row.html rowClass="claude-desktop-role-row" roleLabel="Fable" nameId="claude-desktop-config-fable-name" namePlaceholder="例如：DeepSeek V4 Pro" nameOnInput="syncClaudeDesktopRawConfigFromFields()" selectId="claude-desktop-role-select-fable" modelId="claude-desktop-config-fable" boxId="claude-desktop-1m-box-fable" oneMTitle="勾选后实际请求模型将声明 1M 上下文支持" checkId="claude-desktop-1m-fable" oneMHandler="onClaudeDesktop1mChange" roleKey="fable" -->
<!-- @include partials/components/platform-claude-role-row.html rowClass="claude-desktop-role-row" roleLabel="Haiku" nameId="claude-desktop-config-haiku-name" namePlaceholder="例如：Claude Fable 5" nameOnInput="syncClaudeDesktopRawConfigFromFields()" selectId="claude-desktop-role-select-haiku" modelId="claude-desktop-config-haiku" boxId="claude-desktop-1m-box-haiku" oneMTitle="勾选后实际请求模型将声明 1M 上下文支持" checkId="claude-desktop-1m-haiku" oneMHandler="onClaudeDesktop1mChange" roleKey="haiku" -->
                </div>
              </div>

<!-- @include partials/components/platform-real-config-card.html platformId="claude-desktop" cardStyleExtra=" position: relative; z-index: 1;" titleText="实际配置文件 (claude_desktop_config.json)" descText="以大弹窗查看 Claude 桌面端真实配置文件的完整结构" -->
            </section>
          </div>
        </div>
