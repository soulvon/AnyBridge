name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev libnm-dev xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sidecar/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install sidecar dependencies
        working-directory: sidecar
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build external binaries for Cargo checks
        shell: bash
        run: |
          set -euo pipefail
          HOST="$(rustc -vV | awk '/^host: / {print $2}')"
          python scripts/build/build_sidecar_plain.py --platform "$HOST"
          python scripts/build/build_cursor_core.py --target "$HOST"

      - name: Verify
        if: runner.os == 'Windows'
        run: npm run verify

      - name: Verify
        id: verify_unix
        if: runner.os != 'Windows'
        shell: bash
        continue-on-error: true
        run: npm run verify 2>&1 | tee verify.log

      - name: Verify report
        if: runner.os != 'Windows' && steps.verify_unix.outcome == 'failure'
        shell: bash
        run: |
          tail -80 verify.log | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
          exit 1

      # release profile 才会编译 #[cfg(not(debug_assertions))] 分支，
      # 本地 Windows 与 debug 门控都覆盖不到 unix 下的 release-only 代码。
      # 只在 Linux 跑一次 release check，把该类错误钉在 CI 上。
      - name: Cargo check (release profile, Linux only)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo check --release --message-format short --manifest-path src-tauri/Cargo.toml 2>&1 | tee cargo-release.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -aE "error(\[E[0-9]+\])?: " cargo-release.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -60 cargo-release.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            exit "$status"
          fi
