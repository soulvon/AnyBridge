name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev libnm-dev xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sidecar/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install sidecar dependencies
        working-directory: sidecar
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build external binaries for Cargo checks
        shell: bash
        run: |
          set -euo pipefail
          HOST="$(rustc -vV | awk '/^host: / {print $2}')"
          python scripts/build/build_sidecar_plain.py --platform "$HOST"
          python scripts/build/build_cursor_core.py --target "$HOST"

      - name: Verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $logFile = Join-Path $env:RUNNER_TEMP 'verify.log'
          npm run verify 2>&1 | Tee-Object -FilePath $logFile
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            if (Test-Path $logFile) {
              Get-Content $logFile | Select-String -Pattern '(?:not ok |❌|error(\[E\d+\])?:|AssertionError)' | Select-Object -First 40 | ForEach-Object {
                Write-Output "::error::$($_.Line)"
              }
              Get-Content $logFile -Tail 40 | Where-Object { $_ -ne '' } | ForEach-Object {
                Write-Output "::error::$_"
              }
            }
            exit $code
          }

      # 日志统一写到 RUNNER_TEMP：写到仓库根目录会被 npm run verify 里的
      # runTempFileDiscipline 自动迁入 tmp/，导致后续读取失败。
      - name: Verify (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          LOG_FILE="${RUNNER_TEMP}/verify.log"
          npm run verify 2>&1 | tee "$LOG_FILE"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            if [ -f "$LOG_FILE" ]; then
              grep -aE "not ok |❌|error(\[E[0-9]+\])?:|AssertionError" "$LOG_FILE" | head -40 | while IFS= read -r line; do
                if [ -n "$line" ]; then echo "::error::$line"; fi
              done
              tail -60 "$LOG_FILE" | while IFS= read -r line; do
                if [ -n "$line" ]; then echo "::error::$line"; fi
              done
            fi
            exit "$status"
          fi

      # release profile 才会编译 #[cfg(not(debug_assertions))] 分支，
      # 本地 Windows 与 debug 门控都覆盖不到 Linux/macOS 下的 release-only 代码。
      # 在全部非 Windows runner 上同时检查 cursor-core 与 src-tauri，把跨平台编译错误钉在 CI。
      - name: Cargo check (release profile, non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          LOG_FILE="${RUNNER_TEMP}/cargo-release.log"
          : > "$LOG_FILE"
          status=0
          for cmd_args in \
            "--manifest-path cursor-core/Cargo.toml --release --all-targets" \
            "--manifest-path src-tauri/Cargo.toml --release"; do
            echo ">>> cargo check --message-format short $cmd_args" | tee -a "$LOG_FILE"
            cargo check --message-format short $cmd_args 2>&1 | tee -a "$LOG_FILE"
            s=${PIPESTATUS[0]}
            if [ "$s" -ne 0 ]; then
              status=$s
            fi
          done
          if [ "$status" -ne 0 ]; then
            grep -aE "error(\[E[0-9]+\])?: " "$LOG_FILE" | head -40 | while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::error::$line"; fi
            done
            tail -60 "$LOG_FILE" | while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::error::$line"; fi
            done
            exit "$status"
          fi
