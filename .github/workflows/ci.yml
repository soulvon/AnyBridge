name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev libnm-dev xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sidecar/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install sidecar dependencies
        working-directory: sidecar
        run: npm ci

      - name: Check UI
        run: npm run check:ui

      - name: Node unit tests
        run: npm run test:unit

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build sidecar for Cargo check
        shell: bash
        run: |
          set -euo pipefail
          HOST="$(rustc -vV | awk '/^host: / {print $2}')"
          python scripts/build/build_sidecar_plain.py --platform "$HOST"
          python scripts/build/build_cursor_core.py --target "$HOST"

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Prepare LOCAL_PROXY_KEY used by config-dependent tests
        # 部分 Codex 测试经 codex_bearer_token() 读取本机配置目录里的 LOCAL_PROXY_KEY，
        # 该值在开发者机器上由应用首次启动自动生成；CI 是干净容器，这里显式写入，
        # 避免测试成败取决于 runner 上是否先跑过 AnyBridge。
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, sys

          home = pathlib.Path.home()
          if sys.platform == "win32":
              root = pathlib.Path(os.environ.get("APPDATA", home / "AppData" / "Roaming"))
          elif sys.platform == "darwin":
              root = home / "Library" / "Application Support"
          else:
              root = pathlib.Path(os.environ.get("XDG_CONFIG_HOME", home / ".config"))

          config_dir = root / "anybridge"
          config_dir.mkdir(parents=True, exist_ok=True)
          config_file = config_dir / "byok-config.json"
          data = json.loads(config_file.read_text(encoding="utf-8")) if config_file.exists() else {}
          # 真实结构是 {"values": {...}}，写错层级会被解析为缺省而静默读不到。
          values = data.get("values") or {}
          values["LOCAL_PROXY_KEY"] = "ci-local-proxy-key-for-unit-tests"
          data["values"] = values
          config_file.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          print("prepared", config_file)
          PY

      - name: Rust unit tests
        run: npm run test:rust
