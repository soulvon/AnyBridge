name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.app_version.outputs.VERSION }}
      release_id: ${{ steps.source_release.outputs.release_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION="$(node -e "console.log(require('./package.json').version)")"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        shell: bash
        run: |
          node scripts/release/extract_changelog_section.cjs \
            --version "${{ steps.app_version.outputs.VERSION }}" \
            --output release-notes.md

      - name: Ensure draft release
        id: source_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.app_version.outputs.VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AnyBridge v${VERSION}" \
              --notes-file release-notes.md \
              --draft \
              --verify-tag
          fi
          RELEASE_ID="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json id --jq '.id')"
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

  release:
    name: Build & Publish Multi-Platform Release
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            rust_target: ""
            tauri_args: ""
            sidecar_platform: "x86_64-pc-windows-msvc"
            pkg_base: "node-v22.22.3-win-x64"
            sidecar_output: "anybridge-proxy-x86_64-pc-windows-msvc.exe"
          - platform: "macos-latest"
            rust_target: "aarch64-apple-darwin"
            tauri_args: "--target aarch64-apple-darwin"
            sidecar_platform: "aarch64-apple-darwin"
            pkg_base: "node-v22.22.3-macos-arm64"
            sidecar_output: "anybridge-proxy-aarch64-apple-darwin"
          - platform: "macos-latest"
            rust_target: "x86_64-apple-darwin"
            tauri_args: "--target x86_64-apple-darwin"
            sidecar_platform: "x86_64-apple-darwin"
            pkg_base: "node-v22.22.3-macos-x64"
            sidecar_output: "anybridge-proxy-x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            rust_target: ""
            tauri_args: ""
            sidecar_platform: "x86_64-unknown-linux-gnu"
            pkg_base: "node-v22.22.3-linux-x64"
            sidecar_output: "anybridge-proxy-x86_64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate updater signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Missing GitHub Secret TAURI_SIGNING_PRIVATE_KEY. Add the contents of tauri-sign.key before running release builds."
            exit 1
          fi

      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev
          sudo apt-get install -y libnm-dev xdg-utils

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
          cache-dependency-path: |
            package-lock.json
            sidecar/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Sidecar Binary
        shell: bash
        env:
          SIDECAR_PLATFORM: ${{ matrix.sidecar_platform }}
          PKG_BASE: ${{ matrix.pkg_base }}
          OUTPUT_NAME: ${{ matrix.sidecar_output }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          npm ci --prefix sidecar
          export PKG_CACHE_PATH="$(pwd)/.pkg-cache"
          mkdir -p "${PKG_CACHE_PATH}/v3.6"

          echo "Prefetching pkg base binary: $PKG_BASE"
          curl -L --fail --retry 5 --retry-delay 5 \
            "https://github.com/yao-pkg/pkg-fetch/releases/download/v3.6/${PKG_BASE}" \
            -o "${PKG_CACHE_PATH}/v3.6/${PKG_BASE}"
          chmod +x "${PKG_CACHE_PATH}/v3.6/${PKG_BASE}"

          echo "Building Sidecar Proxy: $SIDECAR_PLATFORM -> $OUTPUT_NAME"
          python scripts/build/build_sidecar_plain.py --platform "$SIDECAR_PLATFORM"
          test -s "src-tauri/binaries/$OUTPUT_NAME"
          if [ "${{ matrix.platform }}" != "windows-latest" ]; then
            chmod +x "src-tauri/binaries/$OUTPUT_NAME"
          fi
          ls -lh "src-tauri/binaries/$OUTPUT_NAME"

      - name: Build Cursor Core Binary
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          if [ -n "${RUST_TARGET}" ]; then
            python scripts/build/build_cursor_core.py --target "$RUST_TARGET"
          else
            python scripts/build/build_cursor_core.py
          fi

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUST_TARGET: ${{ matrix.rust_target }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: "v${{ needs.prepare-release.outputs.version }}"
          releaseName: "AnyBridge v${{ needs.prepare-release.outputs.version }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri_args }}

      # Tauri 2.x 打包时会用 bundle.macOS.entitlements 统一签署 externalBin
      # （anybridge-proxy / anybridge-cursor-core）与外层 App Bundle，因此不需要
      # 在打包前预签名（预签名会被覆盖，且校验的是中间文件而非最终产物）。
      #
      # 必须校验最终产物：mac 版「代理无法启动」的根因就是 sidecar 在 Hardened
      # Runtime 下缺少 JIT entitlement，进程启动瞬间被系统以信号 5 (SIGTRAP) 终止。
      # 这里同时做签名校验、entitlement 断言和启动冒烟，任一失败即中断发布。
      - name: Verify macOS bundle signing and sidecar JIT entitlements
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/AnyBridge.app"
          SIDECAR="$APP/Contents/MacOS/anybridge-proxy"
          if [ ! -f "$SIDECAR" ]; then
            echo "FATAL: 未找到打包后的 sidecar: $SIDECAR"
            exit 1
          fi

          echo "--- verify app bundle ---"
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "--- sidecar codesign flags ---"
          codesign -dv --verbose=4 "$SIDECAR" 2>&1 | tee /tmp/sidecar-flags.txt
          if ! grep -Eq '\(runtime\)' /tmp/sidecar-flags.txt; then
            echo "FATAL: sidecar 未启用 Hardened Runtime，签名链路与预期不一致"
            exit 1
          fi

          echo "--- sidecar entitlements ---"
          codesign -d --entitlements :- "$SIDECAR" > /tmp/sidecar.entitlements
          plutil -convert json -o - /tmp/sidecar.entitlements || true
          for key in \
            com.apple.security.cs.allow-jit \
            com.apple.security.cs.allow-unsigned-executable-memory; do
            # plutil 对 boolean true 输出 "1"，缺失时命令失败，统一归入 missing
            value="$(plutil -extract "$key" raw -o - /tmp/sidecar.entitlements 2>/dev/null || echo missing)"
            echo "$key = $value"
            if [ "$value" != "1" ]; then
              echo "FATAL: sidecar 缺少 entitlement 或值不为 true: $key"
              exit 1
            fi
          done

          echo "--- sidecar launch smoke test (SIGTRAP guard) ---"
          CFG_DIR="$(mktemp -d)"
          BYOK_CONFIG_DIR="$CFG_DIR" API_PORT=17450 INFERENCE_PORT=17451 \
            "$SIDECAR" > /tmp/sidecar.log 2>&1 &
          pid=$!
          sleep 5
          if kill -0 "$pid" 2>/dev/null; then
            echo "✅ sidecar 启动后持续存活，JIT / 签名链路正常"
            kill "$pid" 2>/dev/null || true
          else
            code=0
            wait "$pid" || code=$?
            echo "sidecar 已退出，退出码=$code"
            cat /tmp/sidecar.log || true
            if [ "$code" -gt 128 ]; then
              echo "FATAL: sidecar 被信号 $((code - 128)) 终止，签名 / JIT entitlement 仍有问题"
              exit 1
            fi
            echo "sidecar 以退出码结束（非信号终止），不属于本次签名问题"
          fi

  rebuild-latest-json:
    name: Rebuild latest.json and publish release
    needs:
      - prepare-release
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SOURCE_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download release assets (retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          TAG="v${VERSION}"
          downloaded="false"
          for i in $(seq 1 30); do
            if gh release download "$TAG" --repo "$SOURCE_REPO" --dir release-assets --pattern "*" --clobber; then
              downloaded="true"
              echo "Downloaded release assets from $SOURCE_REPO:$TAG"
              break
            fi
            echo "Release assets not ready yet (attempt $i/30). Sleeping 10s..."
            sleep 10
          done
          if [ "$downloaded" != "true" ]; then
            echo "Failed to download release assets from $SOURCE_REPO:$TAG after retries."
            exit 1
          fi

      - name: Read release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "v${VERSION}" --repo "$SOURCE_REPO" --json body --jq '.body' > release-notes.md
          PUBLISHED_AT="$(gh release view "v${VERSION}" --repo "$SOURCE_REPO" --json publishedAt,createdAt --jq '.publishedAt // .createdAt')"
          if [ -z "${PUBLISHED_AT}" ] || [ "${PUBLISHED_AT}" = "null" ]; then
            PUBLISHED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          fi
          echo "PUBLISHED_AT=${PUBLISHED_AT}" >> "$GITHUB_ENV"

      - name: Build merged latest.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/build_merged_latest_json.cjs \
            --version "${VERSION}" \
            --repo "${SOURCE_REPO}" \
            --assets-dir "release-assets" \
            --notes-file "release-notes.md" \
            --published-at "${PUBLISHED_AT}" \
            --output "latest.json"

      - name: Validate platform manifests (借鉴 cockpit-tools 发布门禁)
        shell: bash
        run: |
          set -euo pipefail
          # 校验必需平台键齐备，残缺清单绝不进入 publish 流程
          node -e "
            const fs = require('fs');
            const latest = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
            const required = ['darwin-aarch64', 'darwin-x86_64', 'windows-x86_64', 'linux-x86_64'];
            const missing = required.filter(k => !latest.platforms || !latest.platforms[k]);
            if (missing.length > 0) {
              console.error('FATAL: missing required platform keys: ' + missing.join(', '));
              process.exit(1);
            }
            for (const [key, entry] of Object.entries(latest.platforms)) {
              if (!entry.url || !entry.signature) {
                console.error('FATAL: platform ' + key + ' missing url or signature');
                process.exit(1);
              }
            }
            console.log('Platform manifests OK:', required.join(', '));
          "

      - name: Upload manifests and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          gh release upload "$TAG" --repo "$SOURCE_REPO" latest.json latest-*.json SHA256SUMS.txt --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "v${VERSION}" --repo "$SOURCE_REPO" --draft=false --prerelease=false --latest
