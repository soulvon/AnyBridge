[package]
name = "anybridge"
version = "1.0.4"
description = "AnyBridge desktop client"
authors = ["soulvon"]
edition = "2021"

[lib]
name = "anybridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# CDP 运行期注入（Antigravity IDE 设置页/Agent 面板由本地 Web 应用渲染，文件注入够不到）
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "blocking"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"
flate2 = "1"
dirs = "5"
rcgen = "0.13"
# rcgen 的 not_before / not_after 用 time::OffsetDateTime，需要显式设置证书有效期
time = "0.3"
json5 = "0.4"
toml_edit = "0.22"
tauri-plugin-updater = "2"
chrono = "0.4"
regex = "1"
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
snap = "1"
zip = "2"
tar = "0.4"
rand = "0.8"
futures-util = "0.3"
rfd = "0.15"
serde_yaml = "0.9.34"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Kernel",
    "Win32_System_Registry",
    "Win32_Security_Cryptography",
    "Win32_UI_Shell",
    "Win32_Foundation",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
opt-level = 2
debug = 0
